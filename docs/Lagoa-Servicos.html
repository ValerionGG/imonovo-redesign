<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lagoa — Serviços</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0;background:#F5F1E8}
.lg{--ground:#F5F1E8;--card:#FBF9F4;--ink:#1E2A28;--muted:#4C5754;--teal:#2D6A64;--gold:#D6B083;--sand:#E7DCC8;--line:rgba(30,42,40,.12);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.lg *,.lg *::before,.lg *::after{box-sizing:border-box}
.lg img{display:block;max-width:100%}
.lg h1,.lg h2,.lg h3,.lg h4,.lg p{margin:0}
.lg a{color:inherit}
.lg button,.lg input,.lg select,.lg textarea{font-family:inherit}
.lg a:focus-visible,.lg button:focus-visible,.lg input:focus-visible,.lg select:focus-visible,.lg textarea:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.015em}
.it{font-style:italic;color:var(--teal)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.eyebrow::before{content:'';width:20px;height:10px;border:1.5px solid var(--gold);border-bottom:0;border-radius:20px 20px 0 0}
.muted{color:var(--muted)}
.h2{font-size:clamp(40px,4.6vw,68px);line-height:1.02;letter-spacing:-.02em}
.sec{padding:120px 0 0}
.sec-head{display:flex;flex-direction:column;gap:18px;max-width:720px}
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:0;border-radius:26px 26px 8px 8px;font-size:15px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s,box-shadow .4s,color .3s}
.btn svg{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg{transform:translateX(4px)}
.btn-teal{background:var(--teal);color:#FBF9F4;box-shadow:0 16px 30px -18px rgba(45,106,100,.9)}
.btn-teal:hover{background:#22524D;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(30,42,40,.28)}
.btn-ghost:hover{color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.card{background:var(--card);border-radius:28px;box-shadow:0 30px 60px -44px rgba(30,42,40,.5)}
/* header */
.strip{background:var(--ink);color:#EDE6D8;font-size:12.5px;letter-spacing:.04em}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.strip a{display:inline-flex;align-items:center;gap:6px;min-height:38px;text-decoration:none;color:#EDE6D8;transition:color .3s}
.strip a:hover{color:var(--gold)}
.hdr{position:sticky;top:0;z-index:40;background:rgba(245,241,232,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;min-height:80px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{color:var(--teal)}
.logo-w{font-family:'Instrument Serif',Georgia,serif;font-size:31px;line-height:1;letter-spacing:-.01em}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nl{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14.5px;font-weight:500;text-decoration:none;border-radius:22px 22px 6px 6px;transition:background .3s,color .3s}
.nl:hover{background:rgba(45,106,100,.08);color:var(--teal)}
.nl.on{color:var(--teal)}
.nl.on::after{content:'';position:absolute;left:50%;bottom:3px;width:14px;height:7px;margin-left:-7px;border:1.5px solid var(--gold);border-bottom:0;border-radius:14px 14px 0 0}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.lang button{min-width:44px;min-height:40px;border:0;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .3s,color .3s}
.fav-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s,color .3s}
.fav-btn:hover{transform:translateY(-2px);color:var(--teal)}
.fav-n{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.menu-btn{display:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--ink);color:#FBF9F4;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
@media (max-width:1100px){.nav-links,.hdr-cta{display:none}.menu-btn{display:inline-flex}.tools{margin-left:auto}.mnav{display:grid;gap:4px;padding:8px 20px 20px}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:22px 22px 6px 6px;background:var(--card);text-decoration:none;font-weight:600}}
@media (max-width:700px){.wrap{padding:0 20px}.strip-txt{display:none}.strip-in{justify-content:flex-end}}
/* footer */
.ftr{position:relative;margin-top:140px;padding:120px 0 36px;background:var(--sand);border-radius:50% 50% 0 0/110px 110px 0 0}
.ftr-big{font-size:clamp(46px,6.4vw,96px);line-height:1;text-align:center;letter-spacing:-.025em}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;margin-top:72px;padding-top:48px;border-top:1px solid rgba(30,42,40,.16)}
.ftr h4{margin-bottom:16px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#24564F}
.ftr-col{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ftr-col a{display:inline-flex;align-items:center;gap:8px;min-height:32px;text-decoration:none;transition:color .3s}
.ftr-col a:hover{color:#24564F}
.ftr address{font-style:normal}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(30,42,40,.16);font-size:13px;color:#3E4946}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:translateY(60px) scaleY(.85)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.lg *{animation:none!important;transition:none!important}}
/* hero arcade */
.shero{position:relative;padding:72px 0 0;text-align:center;background:radial-gradient(900px 500px at 50% 10%,rgba(214,176,131,.3),transparent 70%)}
.sh-title{margin:20px auto 0;max-width:980px;font-size:clamp(54px,7vw,116px);line-height:.92;letter-spacing:-.035em}
.sh-title em{font-style:italic;color:var(--teal)}
.sh-sub{margin:24px auto 0;max-width:600px;font-size:18px;color:var(--muted)}
.arcade{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin-top:64px;padding:0 20px}
.ac{flex:0 1 210px;border-radius:999px 999px 0 0;overflow:hidden;border:7px solid var(--card);border-bottom:0;box-shadow:0 40px 60px -40px rgba(30,42,40,.55);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both;transform-origin:bottom}
.ac img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ac:hover img{transform:scale(1.07)}
.ac-in{height:100%;animation:bob 8s ease-in-out infinite}
.arcade-base{height:18px;margin:0 auto;max-width:1240px;background:var(--card);border-radius:0 0 18px 18px;box-shadow:0 20px 40px -30px rgba(30,42,40,.5)}
@media (max-width:760px){.ac.o{display:none}}
/* services */
.seg{display:inline-flex;gap:4px;padding:5px;margin-top:40px;border-radius:999px;background:var(--sand)}
.seg button{min-height:52px;padding:0 26px;border:0;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;transition:background .35s,color .35s,box-shadow .35s}
.svc-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;margin-top:40px;align-items:start}
.acc{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.acc-item{border-bottom:1px solid var(--line);animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.acc-h{display:grid;grid-template-columns:56px minmax(0,1fr) 44px;align-items:center;gap:18px;width:100%;min-height:88px;padding:12px 6px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:padding .4s cubic-bezier(.2,.7,.2,1)}
.acc-h:hover{padding-left:14px}
.acc-ic{width:52px;height:60px;border-radius:999px 999px 10px 10px;display:grid;place-items:center;transition:background .4s,color .4s}
.acc-t{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(26px,2.4vw,34px);line-height:1.05}
.acc-chev{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .45s cubic-bezier(.2,.7,.2,1),background .3s,color .3s}
.acc-b{padding:0 6px 26px 80px;animation:open .45s cubic-bezier(.2,.7,.2,1) both}
.acc-b p{font-size:17px;line-height:1.65;color:#2E3A37;max-width:620px}
.acc-tag{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:#24564F}
.side{position:sticky;top:110px;display:flex;flex-direction:column;gap:18px}
.side-img{position:relative;height:520px;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--sand)}
.side-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s,transform 1.8s cubic-bezier(.2,.7,.2,1)}
.side-cap{position:absolute;left:20px;right:20px;bottom:20px;padding:18px 20px;border-radius:20px;background:rgba(251,249,244,.95)}
.side-cap b{display:block;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:26px;line-height:1.1}
.side-cap span{font-size:14px;color:var(--muted)}
@media (max-width:980px){.svc-wrap{grid-template-columns:1fr}.side{position:static}.side-img{height:380px}.acc-b{padding-left:6px}}
/* process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px;margin-top:56px}
.st{position:relative;display:flex;flex-direction:column;gap:14px;padding:70px 28px 30px;border-radius:999px 999px 26px 26px;background:var(--card);text-align:center;align-items:center;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.st:hover{transform:translateY(-8px);box-shadow:0 40px 60px -44px rgba(30,42,40,.55)}
.st-n{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:64px;line-height:.8;color:var(--teal)}
.st h3{font-size:28px;line-height:1.05}
.st p{font-size:15px;color:var(--muted)}
/* bilingual band */
.bi{position:relative;margin-top:130px;padding:100px 0;overflow:hidden;background:var(--teal);color:#FBF9F4;border-radius:50% 50% 50% 50%/80px 80px 80px 80px}
.bi::before{content:'';position:absolute;right:-10%;top:-40%;width:640px;height:640px;border-radius:50%;background:radial-gradient(closest-side,rgba(241,221,186,.35),transparent)}
.bi-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;align-items:center}
.bi-big{font-size:clamp(56px,7vw,116px);line-height:.9;letter-spacing:-.03em}
.bi-big em{font-style:italic;color:#F1DDBA}
.bi p{font-size:18px;color:rgba(251,249,244,.9)}
.bi .eyebrow{color:#F1DDBA}
.bi-line{display:block;width:100%;height:30px;margin-top:20px}
.bi-line path{stroke-dasharray:1400;animation:draw 3s ease both}
.bi .btn{margin-top:26px;background:#FBF9F4;color:var(--ink)}
@media (max-width:900px){.bi-grid{grid-template-columns:1fr}}
/* cta */
.cta2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:36px;align-items:center;padding:28px 40px 28px 28px;border-radius:999px;background:var(--card);box-shadow:0 40px 70px -50px rgba(30,42,40,.55)}
.cta2-img{width:120px;height:120px;border-radius:50%;overflow:hidden}
.cta2-img img{width:100%;height:100%;object-fit:cover}
.cta2 h2{font-size:clamp(30px,3vw,44px);line-height:1.05}
.cta2-btns{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:900px){.cta2{grid-template-columns:1fr;border-radius:32px;text-align:center;justify-items:center}}
</style>
</helmet>
<div class="lg" style="{{ rootStyle }}">

<div class="strip">
  <div class="wrap strip-in">
    <span class="strip-txt">{{ t.strip }}</span>
    <a href="index.html"><span>{{ t.allProps }}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</div>
<header class="hdr">
  <div class="wrap hdr-in">
    <a href="Lagoa-Home.html" class="logo" aria-label="Imonovo — início">
      <svg width="26" height="32" viewBox="0 0 26 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 31V13a11.5 11.5 0 0 1 23 0v18"/><path d="M7.5 31V14.5a5.5 5.5 0 0 1 11 0V31"/><path d="M0 31h26"/></svg>
      <span class="logo-w">Imonovo</span>
    </a>
    <nav class="nav-links" aria-label="Principal">
      <a class="nl" href="Lagoa-Home.html">{{ t.nav.home }}</a>
      <a class="nl" href="Lagoa-Imoveis.html">{{ t.nav.imoveis }}</a>
      <a class="nl" href="Lagoa-Imoveis.html#empreendimentos">{{ t.nav.emp }}</a>
      <a class="nl" href="Lagoa-Vender.html">{{ t.nav.vender }}</a>
      <a class="nl on" href="Lagoa-Servicos.html" aria-current="page">{{ t.nav.serv }}</a>
      <a class="nl" href="Lagoa-Contactos.html">{{ t.nav.cont }}</a>
    </nav>
    <div class="tools">
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" style="{{ ptStyle }}" aria-pressed="{{ ptPressed }}" onClick="{{ setPT }}">PT</button>
        <button type="button" style="{{ frStyle }}" aria-pressed="{{ frPressed }}" onClick="{{ setFR }}">FR</button>
      </div>
      <a href="Lagoa-Imoveis.html" class="fav-btn" aria-label="{{ t.favs }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>
        <span class="fav-n">{{ favCount }}</span>
      </a>
      <a href="Lagoa-Vender.html" class="btn btn-teal hdr-cta">{{ t.cta }}</a>
      <button type="button" class="menu-btn" aria-label="Menu" aria-expanded="{{ menuExpanded }}" onClick="{{ toggleMenu }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9h16M4 15h16"/></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav" aria-label="Menu móvel">
      <a href="Lagoa-Home.html">{{ t.nav.home }}</a>
      <a href="Lagoa-Imoveis.html">{{ t.nav.imoveis }}</a>
      <a href="Lagoa-Imoveis.html#empreendimentos">{{ t.nav.emp }}</a>
      <a href="Lagoa-Vender.html">{{ t.nav.vender }}</a>
      <a href="Lagoa-Servicos.html">{{ t.nav.serv }}</a>
      <a href="Lagoa-Contactos.html">{{ t.nav.cont }}</a>
    </nav>
  </sc-if>
</header>

<main>
<section class="shero">
  <div class="wrap">
    <span class="eyebrow rise">{{ t.eyebrow }}</span>
    <h1 class="serif sh-title rise d1">{{ t.h1a }} <em>{{ t.h1b }}</em></h1>
    <p class="sh-sub rise d2">{{ t.sub }}</p>
  </div>
  <div class="arcade" aria-hidden="true">
    <div class="ac o" style="height:300px;animation-delay:.5s"><div class="ac-in" style="animation-delay:-1s"><img src="assets/obidos-door-blue.webp" alt=""></div></div>
    <div class="ac" style="height:390px;animation-delay:.35s"><div class="ac-in" style="animation-delay:-3s"><img src="assets/int-living.webp" alt=""></div></div>
    <div class="ac" style="height:470px;flex-basis:250px;animation-delay:.2s"><div class="ac-in" style="animation-delay:-5s"><img src="assets/white-lane.webp" alt=""></div></div>
    <div class="ac" style="height:390px;animation-delay:.35s"><div class="ac-in" style="animation-delay:-2s"><img src="assets/kitchen-white.webp" alt=""></div></div>
    <div class="ac o" style="height:300px;animation-delay:.5s"><div class="ac-in" style="animation-delay:-4s"><img src="assets/obidos-blue.webp" alt=""></div></div>
  </div>
  <div class="wrap"><div class="arcade-base"></div></div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow">{{ t.listEy }}</span>
      <h2 class="serif h2">{{ t.listA }} <em class="it">{{ t.listB }}</em></h2>
    </div>
    <div class="seg" role="tablist" aria-label="{{ t.listEy }}">
      <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="2">
        <button type="button" role="tab" style="{{ tb.style }}" aria-selected="{{ tb.pressed }}" onClick="{{ tb.pick }}">{{ tb.label }}</button>
      </sc-for>
    </div>
    <div class="svc-wrap">
      <div class="acc" role="tabpanel">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
          <div class="acc-item">
            <button type="button" class="acc-h" aria-expanded="{{ it.expanded }}" onClick="{{ it.toggle }}">
              <span class="acc-ic" style="{{ it.icStyle }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.d }}"/></svg></span>
              <span class="acc-t">{{ it.title }}</span>
              <span class="acc-chev" style="{{ it.chevStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
            </button>
            <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
              <div class="acc-b">
                <p>{{ it.text }}</p>
                <span class="acc-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>{{ it.tag }}</span>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <aside class="side">
        <div class="side-img">
          <sc-for list="{{ sideImgs }}" as="si" hint-placeholder-count="1">
            <img src="{{ si.src }}" alt="{{ si.alt }}" style="{{ si.style }}">
          </sc-for>
          <div class="side-cap" aria-live="polite"><b>{{ side.title }}</b><span>{{ side.sub }}</span></div>
        </div>
        <a href="Lagoa-Contactos.html" class="btn btn-teal">{{ t.askThis }}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </aside>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow">{{ t.procEy }}</span>
      <h2 class="serif h2">{{ t.procA }} <em class="it">{{ t.procB }}</em></h2>
    </div>
