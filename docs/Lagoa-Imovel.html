<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lagoa — Moradia T5 Nadadouro</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0;background:#F5F1E8}
.lg{--ground:#F5F1E8;--card:#FBF9F4;--ink:#1E2A28;--muted:#4C5754;--teal:#2D6A64;--gold:#D6B083;--sand:#E7DCC8;--line:rgba(30,42,40,.12);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.lg *,.lg *::before,.lg *::after{box-sizing:border-box}
.lg img{display:block;max-width:100%}
.lg h1,.lg h2,.lg h3,.lg h4,.lg p{margin:0}
.lg a{color:inherit}
.lg button,.lg input,.lg select,.lg textarea{font-family:inherit}
.lg a:focus-visible,.lg button:focus-visible,.lg input:focus-visible,.lg select:focus-visible,.lg textarea:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.015em}
.it{font-style:italic;color:var(--teal)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.eyebrow::before{content:'';width:20px;height:10px;border:1.5px solid var(--gold);border-bottom:0;border-radius:20px 20px 0 0}
.muted{color:var(--muted)}
.h2{font-size:clamp(40px,4.6vw,68px);line-height:1.02;letter-spacing:-.02em}
.sec{padding:120px 0 0}
.sec-head{display:flex;flex-direction:column;gap:18px;max-width:720px}
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:0;border-radius:26px 26px 8px 8px;font-size:15px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s,box-shadow .4s,color .3s}
.btn svg{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg{transform:translateX(4px)}
.btn-teal{background:var(--teal);color:#FBF9F4;box-shadow:0 16px 30px -18px rgba(45,106,100,.9)}
.btn-teal:hover{background:#22524D;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(30,42,40,.28)}
.btn-ghost:hover{color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.card{background:var(--card);border-radius:28px;box-shadow:0 30px 60px -44px rgba(30,42,40,.5)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:22px 22px 6px 6px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(30,42,40,.16);transition:background .3s,color .3s,box-shadow .3s,transform .3s}
.chip:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--teal)}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:13px;font-weight:600}
.inp{width:100%;min-height:50px;padding:12px 16px;border:1px solid rgba(30,42,40,.2);border-radius:18px 18px 6px 6px;background:#FFFEFB;font-size:15.5px;color:var(--ink);transition:border-color .3s,box-shadow .3s}
.inp::placeholder{color:#66706D}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,106,100,.14)}
textarea.inp{min-height:96px;resize:vertical}
.ok{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-radius:22px;background:rgba(45,106,100,.1);animation:rise .6s both}
.err{font-size:13.5px;font-weight:600;color:#9A3B2E}
/* header */
.strip{background:var(--ink);color:#EDE6D8;font-size:12.5px;letter-spacing:.04em}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.strip a{display:inline-flex;align-items:center;gap:6px;min-height:38px;text-decoration:none;color:#EDE6D8;transition:color .3s}
.strip a:hover{color:var(--gold)}
.hdr{position:sticky;top:0;z-index:40;background:rgba(245,241,232,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;min-height:80px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{color:var(--teal)}
.logo-w{font-family:'Instrument Serif',Georgia,serif;font-size:31px;line-height:1;letter-spacing:-.01em}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nl{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14.5px;font-weight:500;text-decoration:none;border-radius:22px 22px 6px 6px;transition:background .3s,color .3s}
.nl:hover{background:rgba(45,106,100,.08);color:var(--teal)}
.nl.on{color:var(--teal)}
.nl.on::after{content:'';position:absolute;left:50%;bottom:3px;width:14px;height:7px;margin-left:-7px;border:1.5px solid var(--gold);border-bottom:0;border-radius:14px 14px 0 0}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.lang button{min-width:44px;min-height:40px;border:0;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .3s,color .3s}
.fav-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s,color .3s}
.fav-btn:hover{transform:translateY(-2px);color:var(--teal)}
.fav-n{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.menu-btn{display:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--ink);color:#FBF9F4;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
@media (max-width:1100px){.nav-links,.hdr-cta{display:none}.menu-btn{display:inline-flex}.tools{margin-left:auto}.mnav{display:grid;gap:4px;padding:8px 20px 20px}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:22px 22px 6px 6px;background:var(--card);text-decoration:none;font-weight:600}}
@media (max-width:700px){.wrap{padding:0 20px}.strip-txt{display:none}.strip-in{justify-content:flex-end}}
/* footer */
.ftr{position:relative;margin-top:140px;padding:120px 0 36px;background:var(--sand);border-radius:50% 50% 0 0/110px 110px 0 0}
.ftr-big{font-size:clamp(46px,6.4vw,96px);line-height:1;text-align:center;letter-spacing:-.025em}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;margin-top:72px;padding-top:48px;border-top:1px solid rgba(30,42,40,.16)}
.ftr h4{margin-bottom:16px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#24564F}
.ftr-col{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ftr-col a{display:inline-flex;align-items:center;gap:8px;min-height:32px;text-decoration:none;transition:color .3s}
.ftr-col a:hover{color:#24564F}
.ftr address{font-style:normal}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(30,42,40,.16);font-size:13px;color:#3E4946}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes archIn{from{clip-path:inset(100% 0 0 0 round 420px 420px 28px 28px)}to{clip-path:inset(0 0 0 0 round 420px 420px 28px 28px)}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.lg *{animation:none!important;transition:none!important}}
/* title */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-top:20px;font-size:13.5px;color:var(--muted)}
.crumb a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;text-decoration:none}
.crumb a:hover{color:var(--teal)}
.ttl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px;margin-top:4px}
.ttl h1{max-width:820px;margin-top:14px;font-size:clamp(46px,5.4vw,84px);line-height:.98;letter-spacing:-.03em}
.ttl h1 em{font-style:italic;color:var(--teal)}
.pbox{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.price{font-family:'Instrument Serif',Georgia,serif;font-size:58px;line-height:1;letter-spacing:-.02em}
.pbox-row{display:flex;gap:10px}
.round{width:52px;height:52px;border:0;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(30,42,40,.18);transition:transform .3s,color .3s}
.round:hover{transform:translateY(-2px);color:var(--teal)}
/* gallery */
.stage{position:relative;height:620px;margin-top:36px;border-radius:420px 420px 28px 28px;overflow:hidden;background:var(--sand);box-shadow:0 60px 90px -60px rgba(30,42,40,.6);animation:archIn 1.5s cubic-bezier(.2,.7,.2,1) both}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease,transform 1.8s cubic-bezier(.2,.7,.2,1)}
.stage::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,42,40,0) 70%,rgba(30,42,40,.4));pointer-events:none}
.g-cap{position:absolute;left:24px;bottom:24px;z-index:2;padding:10px 18px;border-radius:999px;background:rgba(251,249,244,.95);font-size:13.5px;font-weight:600}
.g-nav{position:absolute;right:24px;bottom:24px;z-index:2;display:flex;align-items:center;gap:10px}
.g-nav button{width:52px;height:52px;border:0;border-radius:50%;background:rgba(251,249,244,.95);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s,background .3s,color .3s}
.g-nav button:hover{background:var(--teal);color:#FBF9F4;transform:scale(1.06)}
.g-count{display:flex;align-items:center;min-height:52px;padding:0 18px;border-radius:999px;background:rgba(30,42,40,.78);color:#FBF9F4;font-size:14px;font-weight:700;letter-spacing:.12em}
.thumbs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin-top:14px}
.thumb{height:112px;padding:0;border:0;border-radius:999px 999px 12px 12px;overflow:hidden;cursor:pointer;background:var(--sand);transition:opacity .35s,transform .35s,box-shadow .35s}
.thumb:hover{transform:translateY(-4px);opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover}
.g-note{margin-top:10px;font-size:12.5px;color:var(--muted)}
@media (max-width:820px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}.stage{height:420px;border-radius:220px 220px 22px 22px}.g-cap{display:none}}
/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin-top:40px}
.fact{display:flex;flex-direction:column;gap:8px;padding:22px 20px;border-radius:26px 26px 10px 10px;background:var(--card);transition:transform .4s,box-shadow .4s}
.fact:hover{transform:translateY(-4px);box-shadow:0 24px 40px -30px rgba(30,42,40,.5)}
.fact b{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:42px;line-height:1;color:var(--teal)}
.fact svg{color:var(--teal)}
.fact span{font-size:13.5px;font-weight:600;line-height:1.35}
.fact small{font-size:12px;color:var(--muted)}
/* detail */
.det{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:56px;margin-top:80px;align-items:start}
.tabs{display:flex;gap:4px;width:max-content;max-width:100%;padding:5px;border-radius:999px;background:var(--sand);overflow-x:auto}
.tabs button{min-height:46px;padding:0 22px;border:0;border-radius:999px;font-size:14.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .3s,color .3s}
.panel{margin-top:34px;animation:fade .5s both}
.desc p{margin-top:18px;font-size:18px;line-height:1.75;color:#2E3A37}
.desc p:first-child{margin-top:0}
.desc p:first-child::first-letter{float:left;padding:8px 12px 0 0;font-family:'Instrument Serif',Georgia,serif;font-size:76px;line-height:.8;color:var(--teal)}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:0 36px;margin:36px 0 0}
.spec div{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:600;text-align:right}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.feat li{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:var(--card);font-weight:600}
.feat .bul{flex:0 0 34px;height:38px;border-radius:999px 999px 8px 8px;background:var(--ground);color:var(--teal);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(214,176,131,.8)}
.locmap{position:relative;height:380px;border-radius:999px 999px 26px 26px;overflow:hidden;background:#EDE5D6}
.locmap svg{position:absolute;inset:0;width:100%;height:100%}
.lm-pin{position:absolute;left:52%;top:52%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px #FBF9F4}
.lm-pin::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--teal);animation:ping 2.2s ease-out infinite}
.lm-tag{position:absolute;left:52%;top:52%;transform:translate(-50%,-150%);padding:8px 14px;border-radius:16px 16px 6px 6px;background:var(--ink);color:#FBF9F4;font-size:12.5px;font-weight:700;white-space:nowrap}
.lm-lbl{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3E4946;white-space:nowrap}
.near{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-top:18px}
.near div{display:flex;justify-content:space-between;padding:14px 18px;border-radius:18px;background:var(--card);font-size:14.5px}
/* aside */
.aside{position:sticky;top:110px;display:flex;flex-direction:column;gap:16px}
.visit{display:flex;flex-direction:column;gap:16px;padding:86px 28px 28px;border-radius:999px 999px 30px 30px;background:var(--card);box-shadow:0 40px 70px -50px rgba(30,42,40,.55)}
.visit h2{font-size:38px;line-height:1;text-align:center}
.visit .lead{margin-top:-6px;text-align:center;font-size:14.5px;color:var(--muted)}
.v-l{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.day{flex-direction:column;gap:0;min-height:64px;padding:8px}
.day small{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.day b{font-family:'Instrument Serif',Georgia,serif;font-size:26px;font-weight:400;line-height:1}
.hours{display:flex;flex-wrap:wrap;gap:8px}
.agent{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:var(--card)}
.agent-img{flex:0 0 64px;height:76px;border-radius:999px 999px 10px 10px;overflow:hidden}
.agent-img img{width:100%;height:100%;object-fit:cover}
.agent a{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-weight:700;color:#24564F;text-decoration:none}
@media (max-width:1000px){.det{grid-template-columns:1fr}.aside{position:static}}
/* simulator */
.sim{margin-top:130px;padding:110px 0;background:var(--sand);border-radius:50% 50% 50% 50%/90px 90px 90px 90px}
.sim-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:center;margin-top:48px}
.sl{display:flex;flex-direction:column;gap:4px;padding:18px 0;border-bottom:1px solid rgba(30,42,40,.16)}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sl-top label{font-weight:600}
.sl-v{font-family:'Instrument Serif',Georgia,serif;font-size:32px;line-height:1;color:#24564F}
.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:18px 0 8px;border-radius:6px;cursor:pointer}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:32px;border-radius:13px 13px 6px 6px;background:var(--teal);border:3px solid #FBF9F4;box-shadow:0 8px 16px -6px rgba(30,42,40,.6);cursor:pointer}
.range::-moz-range-thumb{width:22px;height:28px;border-radius:13px 13px 6px 6px;background:var(--teal);border:3px solid #FBF9F4;cursor:pointer}
.result{position:relative;padding:96px 40px 40px;border-radius:999px 999px 34px 34px;background:var(--teal);color:#FBF9F4;text-align:center;overflow:hidden;isolation:isolate}
.result::before{content:'';position:absolute;left:50%;top:-140px;z-index:-1;width:380px;height:380px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(241,221,186,.45),transparent)}
.result .lbl{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#F1DDBA}
.result .big{margin-top:14px;font-family:'Instrument Serif',Georgia,serif;font-size:clamp(58px,6vw,92px);line-height:1;letter-spacing:-.02em}
.result .per{font-size:15px;color:rgba(251,249,244,.86)}
.split{display:flex;height:12px;margin-top:30px;border-radius:12px;overflow:hidden;background:rgba(251,249,244,.18)}
.split span{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.legend{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:13.5px;color:rgba(251,249,244,.9)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;vertical-align:middle}
.res-rows{margin-top:24px;border-top:1px solid rgba(251,249,244,.22)}
.res-rows div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(251,249,244,.22);font-size:15px}
.disc{margin-top:18px;font-size:12.5px;color:rgba(251,249,244,.82)}
@media (max-width:900px){.sim-grid{grid-template-columns:1fr}}
/* cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:28px;margin-top:44px}
.pcard{position:relative;display:flex;flex-direction:column;padding:12px 12px 24px;border-radius:30px;background:var(--card);box-shadow:0 30px 60px -44px rgba(30,42,40,.5);transition:transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .6s}
.pcard:hover{transform:translateY(-8px);box-shadow:0 46px 70px -42px rgba(30,42,40,.55)}
.pc-media{position:relative}
.pc-img{display:block;height:320px;border-radius:999px 999px 18px 18px;overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .pc-img img{transform:scale(1.07)}
.pc-fav{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(251,249,244,.95);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s,color .3s}
.pc-fav:hover{transform:scale(1.1);color:var(--teal)}
.pc-badge{position:absolute;left:14px;bottom:18px;padding:7px 14px;border-radius:999px;background:var(--ink);color:#FBF9F4;font-size:12px;font-weight:600}
.pc-body{display:flex;flex-direction:column;gap:8px;padding:20px 14px 0}
.pc-loc{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.pc-t{font-size:31px;line-height:1.05;text-decoration:none;transition:color .3s}
.pc-t:hover{color:var(--teal)}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:16px;border-top:1px dashed rgba(30,42,40,.2);font-size:14px;color:var(--muted)}
.pc-price{font-size:21px;font-weight:700;color:var(--ink)}
</style>
