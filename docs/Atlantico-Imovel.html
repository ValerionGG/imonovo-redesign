<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atlântico — Moradia T5, Nadadouro</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A1518}
.at{background:#0A1518;color:#E8E4DA;font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.at *{box-sizing:border-box}
.at a{color:inherit}
.at img{display:block;max-width:100%}
.serif{font-family:'Bodoni Moda',Didot,serif;font-optical-sizing:auto}
.disp{font-family:'Bodoni Moda',Didot,serif;font-variation-settings:'opsz' 96;font-weight:400;letter-spacing:-0.025em;line-height:.94}
.num{font-family:'Bodoni Moda',Didot,serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}
.it{font-style:italic;color:#D6B083}
.eyebrow{font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#D6B083;margin:0}
.muted{color:#9FB0AE}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:0 28px;border:1px solid #D6B083;background:#D6B083;color:#0A1518;font:600 12px/1 'Manrope',sans-serif;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .4s,color .4s,border-color .4s}
.at a.btn{color:#0A1518}
.btn:hover,.at a.btn:hover{background:transparent;color:#D6B083}
.btn svg{transition:transform .5s cubic-bezier(.19,1,.22,1)}
.btn:hover svg{transform:translateX(5px)}
.btn-g,.at a.btn-g{background:transparent;color:#E8E4DA;border-color:rgba(232,228,218,.4)}
.btn-g:hover,.at a.btn-g:hover{border-color:#D6B083;color:#D6B083}
.btn-sm{min-height:44px;padding:0 18px;font-size:11px}
.at :focus-visible{outline:1px solid #D6B083;outline-offset:4px}
.nl{position:relative;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.06em;padding:12px 0}
.nl::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#D6B083;transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.19,1,.22,1)}
.nl:hover::after{transform:scaleX(1);transform-origin:left}
.lg{min-width:44px;min-height:44px;background:transparent;border:0;color:#9FB0AE;font:600 11px 'Manrope';letter-spacing:.2em;cursor:pointer;transition:color .3s}
.lg:hover{color:#E8E4DA}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid rgba(232,228,218,.25);border-radius:50%;text-decoration:none;transition:border-color .3s,color .3s;background:transparent;color:#E8E4DA;cursor:pointer}
.icon-btn:hover{border-color:#D6B083;color:#D6B083}
.badge{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#D6B083;color:#0A1518;font-size:12px;line-height:20px;text-align:center}
.burger{display:none}
.mnav a{display:block;padding:14px 0;border-bottom:1px solid rgba(214,176,131,.18);font-family:'Bodoni Moda',serif;font-size:30px;text-decoration:none}
@keyframes kb{0%{transform:scale(1.02) translate3d(0,0,0)}100%{transform:scale(1.12) translate3d(-1.5%,-1.5%,0)}}
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln>span{display:inline-block;animation:lnUp 1.5s cubic-bezier(.19,1,.22,1) both}
@keyframes lnUp{0%{transform:translateY(108%);clip-path:inset(0 0 100% 0)}100%{transform:translateY(0);clip-path:inset(-10% 0 -20% 0)}}
.d1{animation-delay:.2s!important}.d2{animation-delay:.36s!important}.d3{animation-delay:.52s!important}.d4{animation-delay:.9s!important}.d5{animation-delay:1.1s!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp 1.2s cubic-bezier(.19,1,.22,1) both}
.grain{position:absolute;inset:-24px;pointer-events:none;z-index:60;opacity:.55;mix-blend-mode:overlay;background-image:repeating-radial-gradient(circle at 13% 27%,rgba(232,228,218,.07) 0,rgba(232,228,218,.07) 1px,transparent 1px,transparent 3px),repeating-radial-gradient(circle at 71% 63%,rgba(0,0,0,.25) 0,rgba(0,0,0,.25) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(97deg,rgba(232,228,218,.03) 0 1px,transparent 1px 3px)}
.grain-a{animation:grain 1.1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-9px,6px)}40%{transform:translate(7px,-10px)}60%{transform:translate(-5px,11px)}80%{transform:translate(10px,4px)}100%{transform:translate(0,0)}}
.chap{display:grid;grid-template-columns:96px minmax(0,1fr);max-width:1440px;margin:0 auto;padding:0 40px}
.rail{position:relative;border-right:1px solid rgba(214,176,131,.2)}
.rail .rn{position:absolute;top:0;right:22px;font-size:15px;color:#D6B083}
.rail .rv{position:absolute;top:48px;right:20px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#9FB0AE;white-space:nowrap}
.cbody{padding-left:56px;min-width:0}
.chip{min-height:44px;padding:0 18px;border:1px solid rgba(232,228,218,.25);border-radius:999px;background:transparent;color:#E8E4DA;font:500 13px 'Manrope';letter-spacing:.04em;cursor:pointer;transition:border-color .3s,color .3s,background .3s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chip:hover{border-color:#D6B083}
.gimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1s ease,transform 6s cubic-bezier(.19,1,.22,1)}
.gnav{position:absolute;top:50%;margin-top:-30px;width:60px;height:60px;border-radius:50%;border:1px solid rgba(232,228,218,.5);background:rgba(10,21,24,.35);color:#E8E4DA;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:border-color .3s,background .3s,transform .4s}
.gnav:hover{border-color:#D6B083;background:rgba(10,21,24,.65);transform:scale(1.06)}
.thumb{flex:0 0 132px;height:88px;padding:0;border:1px solid transparent;background:#0F2126;cursor:pointer;overflow:hidden;transition:border-color .3s,opacity .3s}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.thumb:hover img{transform:scale(1.08)}
.tab{background:transparent;border:0;border-bottom:1px solid transparent;color:#E8E4DA;min-height:52px;padding:0 2px;cursor:pointer;font-family:'Bodoni Moda',serif;font-size:26px;transition:color .3s,border-color .3s}
.tab:hover{color:#D6B083}
.frow{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-top:1px solid rgba(232,228,218,.12)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;margin:0}
.rng::-webkit-slider-runnable-track{height:1px;background:rgba(232,228,218,.4)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#D6B083;border:0;margin-top:-10px;transition:transform .3s;box-shadow:0 0 0 6px rgba(214,176,131,.15)}
.rng:hover::-webkit-slider-thumb{transform:scale(1.2)}
.rng::-moz-range-track{height:1px;background:rgba(232,228,218,.4)}
.rng::-moz-range-progress{height:1px;background:#D6B083}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#D6B083;border:0}
.fld{width:100%;min-height:52px;background:transparent;border:0;border-bottom:1px solid rgba(232,228,218,.35);color:#E8E4DA;font:400 17px 'Manrope';padding:0;border-radius:0;transition:border-color .3s}
.fld::placeholder{color:#7F918F}
.fld:focus{outline:none;border-bottom-color:#D6B083}
.card{position:relative;animation:fadeUp 1s cubic-bezier(.19,1,.22,1) both}
.card .ph{position:relative;overflow:hidden;background:#0F2126}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.19,1,.22,1),filter .8s}
.card:hover .ph img{transform:scale(1.07);filter:brightness(.72)}
.ring{position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;border:1px solid #D6B083;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#E8E4DA;font:600 10px/1 'Manrope';letter-spacing:.32em;text-transform:uppercase;opacity:0;transform:scale(.35);transition:opacity .5s,transform .8s cubic-bezier(.19,1,.22,1);pointer-events:none;background:rgba(10,21,24,.28)}
.ring::after{content:"";position:absolute;inset:-9px;border:1px solid rgba(214,176,131,.35);border-radius:50%;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.3}}
.card:hover .ring{opacity:1;transform:scale(1)}
.stretch{text-decoration:none}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}
.fav{position:absolute;top:16px;right:16px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,228,218,.4);background:rgba(10,21,24,.45);color:#E8E4DA;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s,transform .4s}
.fav:hover{border-color:#D6B083;transform:scale(1.08)}
.tagr{position:absolute;left:16px;top:16px;background:#D6B083;color:#0A1518;font:700 10px/1 'Manrope';letter-spacing:.2em;text-transform:uppercase;padding:8px 10px}
.feat{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid rgba(232,228,218,.12)}
.feat svg{flex:0 0 auto;color:#D6B083}
.foot-wm{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(64px,16.5vw,250px);line-height:.85;text-align:center;color:transparent;-webkit-text-stroke:1px rgba(214,176,131,.38);margin:72px 0 28px;letter-spacing:-.02em;white-space:nowrap;user-select:none}
.flink{display:block;text-decoration:none;padding:6px 0;transition:color .3s}
.flink:hover{color:#D6B083}
@media (max-width:960px){
.nav-links,.hide-m{display:none!important}
.burger{display:inline-flex}
.wrap{padding:0 20px}
.chap{grid-template-columns:1fr;padding:0 20px}
.rail{border-right:0;border-top:1px solid rgba(214,176,131,.2);height:44px}
.rail .rn{left:0;right:auto;top:12px}
.rail .rv{writing-mode:horizontal-tb;transform:none;top:16px;left:44px;right:auto}
.cbody{padding-left:0}
.stage{height:420px!important}
}
@media (prefers-reduced-motion:reduce){.grain-a,.ln>span,.fu,.card{animation:none!important}.gimg{transition:opacity .3s!important}}
</style>
</helmet>
<div class="at">
<div class="grain" aria-hidden="true" style="{{ grainStyle }}"></div>

<header style="position:absolute;top:0;left:0;right:0;z-index:40">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:24px;height:96px">
    <a href="Atlantico-Home.html" aria-label="Imonovo — Início" style="text-decoration:none;display:flex;align-items:center;gap:14px">
      <span style="display:block;width:28px;height:1px;background:#D6B083"></span>
      <span class="serif" style="font-size:21px;letter-spacing:.36em;font-weight:500">IMONOVO</span>
    </a>
    <nav class="nav-links" aria-label="Principal" style="display:flex;gap:32px;align-items:center">
      <a class="nl" href="Atlantico-Home.html">{{ t.home }}</a>
      <a class="nl" href="Atlantico-Imoveis.html" style="color:#D6B083">{{ t.imoveis }}</a>
      <a class="nl" href="Atlantico-Imoveis.html#empreendimentos">{{ t.emp }}</a>
      <a class="nl" href="Atlantico-Vender.html">{{ t.vender }}</a>
      <a class="nl" href="Atlantico-Servicos.html">{{ t.serv }}</a>
      <a class="nl" href="Atlantico-Contactos.html">{{ t.cont }}</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px">
      <div role="group" aria-label="Idioma / Langue" style="display:flex;align-items:center">
        <button type="button" class="lg" style="{{ ptStyle }}" aria-pressed="{{ ptPressed }}" onClick="{{ setPT }}">PT</button>
        <span aria-hidden="true" style="width:1px;height:14px;background:rgba(232,228,218,.3)"></span>
        <button type="button" class="lg" style="{{ frStyle }}" aria-pressed="{{ frPressed }}" onClick="{{ setFR }}">FR</button>
      </div>
      <a href="Atlantico-Imoveis.html" class="icon-btn" aria-label="{{ favLabel }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20.5C9 18.6 3.9 15.2 2.9 11.3 2.1 8.1 4.1 5 7.2 5c2.1 0 3.7 1.3 4.8 3 1.1-1.7 2.7-3 4.8-3 3.1 0 5.1 3.1 4.3 6.3-1 3.9-6.1 7.3-9.1 9.2z"/></svg>
        <span class="badge num">{{ favCount }}</span>
      </a>
      <a href="Atlantico-Vender.html" class="btn btn-sm hide-m" style="margin-left:10px">{{ t.cta }}</a>
      <button type="button" class="icon-btn burger" aria-label="Menu" aria-expanded="{{ menuExp }}" onClick="{{ toggleMenu }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h18M3 16h18"/></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav wrap" aria-label="Menu móvel" style="background:#0F2126;padding-top:12px;padding-bottom:28px;border-top:1px solid rgba(214,176,131,.25)">
      <a href="Atlantico-Home.html">{{ t.home }}</a>
      <a href="Atlantico-Imoveis.html">{{ t.imoveis }}</a>
      <a href="Atlantico-Imoveis.html#empreendimentos">{{ t.emp }}</a>
      <a href="Atlantico-Vender.html">{{ t.vender }}</a>
      <a href="Atlantico-Servicos.html">{{ t.serv }}</a>
      <a href="Atlantico-Contactos.html">{{ t.cont }}</a>
    </nav>
  </sc-if>
</header>

<!-- TÍTULO -->
<section class="wrap" style="padding-top:150px">
  <nav aria-label="Navegação estrutural" class="muted fu d1" style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:12px;flex-wrap:wrap">
    <a href="Atlantico-Imoveis.html" class="nl" style="font-size:12px;padding:0">{{ t.imoveis }}</a><span aria-hidden="true">/</span><span>Caldas da Rainha</span><span aria-hidden="true">/</span><span style="color:#E8E4DA">Nadadouro</span>
  </nav>
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:40px;margin-top:30px">
    <h1 class="disp" style="font-size:clamp(64px,9.4vw,150px);margin:0">
      <span class="ln"><span class="d1">{{ t.h1 }}</span></span>
      <span class="ln"><span class="d2 it">Nadadouro.</span></span>
    </h1>
    <div class="fu d4" style="text-align:right;padding-bottom:12px">
      <p class="eyebrow" style="color:#9FB0AE">{{ t.priceL }}</p>
      <p class="num" style="font-size:clamp(48px,5.4vw,80px);line-height:1;margin:10px 0 18px;color:#D6B083">1.380.000 €</p>
      <p class="muted num" style="margin:0 0 22px;font-size:18px;letter-spacing:.06em">T5 · 301 m² · 2014</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
        <a href="#visita" class="btn">{{ t.visit }}</a>
        <button type="button" class="btn btn-g" aria-pressed="{{ favPressed }}" onClick="{{ toggleFav }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="{{ heartStyle }}"><path d="M12 20.5C9 18.6 3.9 15.2 2.9 11.3 2.1 8.1 4.1 5 7.2 5c2.1 0 3.7 1.3 4.8 3 1.1-1.7 2.7-3 4.8-3 3.1 0 5.1 3.1 4.3 6.3-1 3.9-6.1 7.3-9.1 9.2z"/></svg>{{ favTxt }}</button>
      </div>
    </div>
  </div>
</section>

<!-- GALERIA -->
<section class="wrap fu d5" style="padding-top:56px" aria-label="Galeria">
  <div class="stage" style="position:relative;height:700px;overflow:hidden;background:#0F2126">
    <sc-for list="{{ gallery }}" as="g" hint-placeholder-count="9">
      <img class="gimg" src="{{ g.src }}" alt="{{ g.alt }}" style="{{ g.style }}">
    </sc-for>
    <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,21,24,0) 60%,rgba(10,21,24,.85) 100%);pointer-events:none"></div>
    <div class="grain grain-a" aria-hidden="true" style="z-index:2;opacity:.35"></div>
    <button type="button" class="gnav" style="left:28px" aria-label="Imagem anterior" onClick="{{ prev }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
    <button type="button" class="gnav" style="right:28px" aria-label="Imagem seguinte" onClick="{{ next }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
    <div style="position:absolute;left:32px;right:32px;bottom:26px;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:20px" aria-live="polite">
      <p style="margin:0"><span class="eyebrow" style="color:#E8E4DA">Fig. {{ curN }}</span><span class="serif" style="display:block;font-size:30px;font-style:italic;margin-top:6px">{{ curCap }}</span></p>
      <p class="num" style="margin:0;font-size:44px;line-height:1"><span style="color:#D6B083">{{ curN }}</span><span class="muted" style="font-size:22px"> / {{ totalN }}</span></p>
    </div>
  </div>
  <div style="display:flex;gap:10px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin;scrollbar-color:#D6B083 transparent" role="group" aria-label="Miniaturas">
    <sc-for list="{{ gallery }}" as="g" hint-placeholder-count="9">
      <button type="button" class="thumb" style="{{ g.thumbStyle }}" aria-label="{{ g.thumbLabel }}" aria-pressed="{{ g.pressed }}" onClick="{{ g.pick }}"><img src="{{ g.src }}" alt=""></button>
    </sc-for>
  </div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Fotografias ilustrativas.</p>
</section>

<!-- 01 O IMÓVEL -->
<section id="ch-01" class="chap" style="padding-top:130px">
  <div class="rail"><span class="rn num">01</span><span class="rv">{{ t.c1 }}</span></div>
  <div class="cbody">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:72px">
      <div>
        <div role="tablist" aria-label="Detalhes" style="display:flex;flex-wrap:wrap;gap:32px;border-bottom:1px solid rgba(232,228,218,.12);margin-bottom:36px">
          <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3">
            <button type="button" role="tab" class="tab" style="{{ tb.style }}" aria-selected="{{ tb.pressed }}" onClick="{{ tb.pick }}">{{ tb.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ tDesc }}" hint-placeholder-val="{{ true }}">
          <div class="fu">
            <p class="serif" style="font-size:30px;line-height:1.35;margin:0 0 26px">Uma moradia de 301 m² sobre a <span class="it">Lagoa de Óbidos</span>, com o mar no horizonte.</p>
            <p style="margin:0 0 18px;max-width:600px">Moradia T5 no Nadadouro, concelho de Caldas da Rainha, com vista para o mar e para a Lagoa de Óbidos. Construída em 2014, dispõe de piscina aquecida, painéis solares, piso radiante e suite master.</p>
            <p class="muted" style="margin:0;max-width:600px">[DESCRIÇÃO COMPLETA — áreas por divisão, exposição solar, terreno e acabamentos a fornecer pela agência.]</p>
          </div>
        </sc-if>
        <sc-if value="{{ tFeat }}" hint-placeholder-val="{{ false }}">
          <div class="fu" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));column-gap:40px">
            <sc-for list="{{ feats }}" as="f" hint-placeholder-count="8">
              <div class="feat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="{{ f.icon }}"/></svg><span>{{ f.label }}</span></div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ tLoc }}" hint-placeholder-val="{{ false }}">
          <div class="fu">
            <div style="position:relative;height:360px;background:#0F2126;border:1px solid rgba(214,176,131,.22);overflow:hidden">
              <svg viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" aria-label="Mapa estilizado: Nadadouro na margem da Lagoa de Óbidos" role="img">
                <path d="M210 0C190 80 170 140 150 190 132 240 120 300 110 360H600V0Z" fill="#0A1518"/>
                <path d="M210 0C190 80 170 140 150 190 132 240 120 300 110 360" fill="none" stroke="#D6B083" stroke-width="1" opacity=".7"/>
                <path d="M150 190C200 180 290 196 340 228 372 252 350 290 300 284 240 276 180 240 150 190Z" fill="#0F2126" stroke="#D6B083" stroke-width=".8"/>

class Component extends DCLogic {

        h1:'Villa T5,', priceL:'Prix', visit:'Planifier une visite', fav:'Enregistrer', faved:'Enregistré', chapter:'Chapitre',

        visitT1:'Planifier', visitT2:'une visite.', book:'Demander une visite', simiT1:'Biens', simiT2:'similaires.', seeAll:'Tout voir' }
    };
    const t = fr ? T.fr : T.pt;

    const G = [
      ['assets/villa-infinity.webp','Piscina sobre o mar'],
      ['assets/pool-sea.webp','Piscina aquecida'],
      ['assets/terrace-sea.webp','Terraço com vista'],
      ['assets/int-living.webp','Sala de estar'],

      ['assets/int-bath.webp','Casa de banho'],
      ['assets/lagoa-aerial.webp','Lagoa de Óbidos']
    ];
    const total = G.length;
    const gallery = G.map((g, i) => {

      return {
        src: g[0], alt: g[1] + ' — Moradia T5, Nadadouro (imagem ilustrativa)',

    const tabDefs = [{ k:'desc', pt:'Descrição', fr:'Description' }, { k:'feat', pt:'Características', fr:'Caractéristiques' }, { k:'loc', pt:'Localização', fr:'Localisation' }];
    const tabs = tabDefs.map(d => ({ label: fr ? d.fr : d.pt, style: s.tab === d.k ? 'color:#D6B083;border-bottom-color:#D6B083' : '', pressed: s.tab === d.k ? 'true' : 'false', pick: () => this.setState({ tab: d.k }) }));

    const feats = [
      { label:'Vista mar e Lagoa de Óbidos', icon:'M2 16c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M12 4v6M8 8l4-4 4 4' },
      { label:'Piscina aquecida', icon:'M3 18c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5M7 14V5a2 2 0 0 1 4 0M13 14V5a2 2 0 0 1 4 0M7 9h6' },

    }));
    const selDay = s.day > -1 ? dd[s.day] : null;
    const vSummary = selDay ? WD[selDay.getDay()] + ' ' + selDay.getDate() + ' ' + MO[selDay.getMonth()] + ', ' + s.time : '';

    const P = [
      { id:5, title:'Moradia T3', place:'Nadadouro', m2:183, price:650000, img:'assets/villa-pool.webp', alt:'Moradia com piscina', reduced:true },
      { id:2, title:'Moradia T3', place:'Serra do Bouro', m2:177, price:645000, img:'assets/villa-white.webp', alt:'Moradia branca' },
      { id:3, title:'Moradia T3', place:'Caldas da Rainha', m2:195, price:780000, img:'assets/villa-modern-pool.webp', alt:'Moradia moderna branca com piscina' }
    ];
    const similar = P.map((p, i) => {
      const fav = s.favs.indexOf(p.id) > -1;
      return {
        img: p.img, alt: p.alt + ' (imagem ilustrativa)', title: p.title, place: p.place, reduced: !!p.reduced,
        idx: this.pad(i + 1) + ' / 03', m2Txt: p.m2 + ' m²', priceTxt: this.fmt(p.price),
        delay: 'animation-delay:' + (i * 0.08).toFixed(2) + 's',
        favPressed: fav ? 'true' : 'false',
        favLabel: (fav ? 'Remover dos favoritos: ' : 'Adicionar aos favoritos: ') + p.title + ', ' + p.place,
        heartStyle: fav ? 'fill:#D6B083;color:#D6B083' : '',
        toggle: () => this.toggleFav(p.id)
      };
    });
    const isFav = s.favs.indexOf(1) > -1;

    return {
      t, gallery, tabs, feats, days, times, similar,
      curN: this.pad(s.img + 1), totalN: this.pad(total), curCap: G[s.img][1],
      prev: () => this.setState({ img: (s.img - 1 + total) % total }),
      next: () => this.setState({ img: (s.img + 1) % total }),
      tDesc: s.tab === 'desc', tFeat: s.tab === 'feat', tLoc: s.tab === 'loc',
      price: String(s.price), down: String(s.down), years: String(s.years), rate: String(s.rate),
      priceTxt: this.fmt(s.price), downTxt: s.down + ' %', yearsTxt: s.years + (fr ? ' ans' : ' anos'),
      rateTxt: s.rate.toFixed(1).replace('.', ',') + ' %',
      setPrice: e => this.setState({ price: Number(this.val(e)) }),
      setDown: e => this.setState({ down: Number(this.val(e)) }),
      setYears: e => this.setState({ years: Number(this.val(e)) }),
      setRate: e => this.setState({ rate: Number(this.val(e)) }),
      pmtTxt: this.fmt(pmt), loanTxt: this.fmt(loan), downEur: this.fmt(s.price - loan), intTxt: this.fmt(interest),
      nTxt: n + (fr ? ' mensualités' : ' prestações'),
      vName: s.vName, vTel: s.vTel, vEmail: s.vEmail,
      setVName: e => this.setState({ vName: this.val(e) }),
      setVTel: e => this.setState({ vTel: this.val(e) }),
      setVEmail: e => this.setState({ vEmail: this.val(e) }),
      book: () => {
        if (s.day < 0 || !s.time) return this.setState({ vErr: 'Escolha um dia e uma hora.' });
        if (!s.vName.trim() || !(s.vTel.trim() || /.+@.+\..+/.test(s.vEmail))) return this.setState({ vErr: 'Indique o seu nome e um telefone ou email válido.' });
        this.setState({ vDone: true, vErr: '' });
      },
      vReset: () => this.setState({ vDone: false, day: -1, time: '' }),
      vForm: !s.vDone, vDone: s.vDone, vErr: !!s.vErr, vErrTxt: s.vErr, vSummary,
      favPressed: isFav ? 'true' : 'false', favTxt: isFav ? t.faved : t.fav,
      heartStyle: isFav ? 'fill:#D6B083' : '',
      toggleFav: () => this.toggleFav(1),
      menu: s.menu, menuExp: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      ptStyle: fr ? '' : 'color:#D6B083', frStyle: fr ? 'color:#D6B083' : '',
      ptPressed: fr ? 'false' : 'true', frPressed: fr ? 'true' : 'false',
      setPT: () => this.setState({ lang:'pt' }), setFR: () => this.setState({ lang:'fr' }),
      favCount: String(s.favs.length), favLabel: t.favs + ' (' + s.favs.length + ')',
      grainStyle: this.props.grain === true ? '' : 'display:none'
    };
  }
}
</script>
</body>
</html>
