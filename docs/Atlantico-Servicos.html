<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atlântico — Serviços</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A1518}
.at{background:#0A1518;color:#E8E4DA;font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.at *{box-sizing:border-box}
.at a{color:inherit}
.at img{display:block;max-width:100%}
.serif{font-family:'Bodoni Moda',Didot,serif;font-optical-sizing:auto}
.disp{font-family:'Bodoni Moda',Didot,serif;font-variation-settings:'opsz' 96;font-weight:400;letter-spacing:-0.025em;line-height:.94}
.num{font-family:'Bodoni Moda',Didot,serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}
.it{font-style:italic;color:#D6B083}
.eyebrow{font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#D6B083;margin:0}
.muted{color:#9FB0AE}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:0 28px;border:1px solid #D6B083;background:#D6B083;color:#0A1518;font:600 12px/1 'Manrope',sans-serif;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .4s,color .4s,border-color .4s}
.at a.btn{color:#0A1518}
.btn:hover,.at a.btn:hover{background:transparent;color:#D6B083}
.btn svg{transition:transform .5s cubic-bezier(.19,1,.22,1)}
.btn:hover svg{transform:translateX(5px)}
.btn-g,.at a.btn-g{background:transparent;color:#E8E4DA;border-color:rgba(232,228,218,.4)}
.btn-g:hover,.at a.btn-g:hover{border-color:#D6B083;color:#D6B083}
.btn-sm{min-height:44px;padding:0 18px;font-size:11px}
.at :focus-visible{outline:1px solid #D6B083;outline-offset:4px}
.nl{position:relative;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.06em;padding:12px 0}
.nl::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#D6B083;transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.19,1,.22,1)}
.nl:hover::after{transform:scaleX(1);transform-origin:left}
.lg{min-width:44px;min-height:44px;background:transparent;border:0;color:#9FB0AE;font:600 11px 'Manrope';letter-spacing:.2em;cursor:pointer;transition:color .3s}
.lg:hover{color:#E8E4DA}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid rgba(232,228,218,.25);border-radius:50%;text-decoration:none;transition:border-color .3s,color .3s;background:transparent;color:#E8E4DA;cursor:pointer}
.icon-btn:hover{border-color:#D6B083;color:#D6B083}
.badge{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#D6B083;color:#0A1518;font-size:12px;line-height:20px;text-align:center}
.burger{display:none}
.mnav a{display:block;padding:14px 0;border-bottom:1px solid rgba(214,176,131,.18);font-family:'Bodoni Moda',serif;font-size:30px;text-decoration:none}
@keyframes kb{0%{transform:scale(1.04) translate3d(0,0,0)}100%{transform:scale(1.2) translate3d(-2.5%,-2%,0)}}
.kb{animation:kb 26s ease-in-out infinite alternate;transform-origin:50% 50%;will-change:transform}
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln>span{display:inline-block;animation:lnUp 1.5s cubic-bezier(.19,1,.22,1) both}
@keyframes lnUp{0%{transform:translateY(108%);clip-path:inset(0 0 100% 0)}100%{transform:translateY(0);clip-path:inset(-10% 0 -20% 0)}}
.d1{animation-delay:.2s!important}.d2{animation-delay:.36s!important}.d3{animation-delay:.52s!important}.d4{animation-delay:.9s!important}.d5{animation-delay:1.1s!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp 1.2s cubic-bezier(.19,1,.22,1) both}
@keyframes openIn{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.grain{position:absolute;inset:-24px;pointer-events:none;z-index:60;opacity:.55;mix-blend-mode:overlay;background-image:repeating-radial-gradient(circle at 13% 27%,rgba(232,228,218,.07) 0,rgba(232,228,218,.07) 1px,transparent 1px,transparent 3px),repeating-radial-gradient(circle at 71% 63%,rgba(0,0,0,.25) 0,rgba(0,0,0,.25) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(97deg,rgba(232,228,218,.03) 0 1px,transparent 1px 3px)}
.grain-a{animation:grain 1.1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-9px,6px)}40%{transform:translate(7px,-10px)}60%{transform:translate(-5px,11px)}80%{transform:translate(10px,4px)}100%{transform:translate(0,0)}}
@keyframes mq{to{transform:translateX(-50%)}}
.mq{display:flex;align-items:center;width:max-content;animation:mq 40s linear infinite}
.chap{display:grid;grid-template-columns:96px minmax(0,1fr);max-width:1440px;margin:0 auto;padding:0 40px}
.rail{position:relative;border-right:1px solid rgba(214,176,131,.2)}
.rail .rn{position:absolute;top:0;right:22px;font-size:15px;color:#D6B083}
.rail .rv{position:absolute;top:48px;right:20px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#9FB0AE;white-space:nowrap}
.cbody{padding-left:56px;min-width:0}
.tab{background:transparent;border:0;border-bottom:1px solid transparent;color:#E8E4DA;min-height:60px;padding:0 2px;cursor:pointer;font-family:'Bodoni Moda',serif;font-size:34px;display:inline-flex;align-items:baseline;gap:10px;transition:color .3s,border-color .3s}
.tab:hover{color:#D6B083}
.tab sup{font-family:'Manrope';font-size:11px;letter-spacing:.1em;color:#9FB0AE}
.acc{display:flex;align-items:center;gap:22px;width:100%;min-height:76px;padding:18px 0;background:transparent;border:0;border-top:1px solid rgba(232,228,218,.14);color:#E8E4DA;text-align:left;cursor:pointer;transition:color .4s,padding-left .6s cubic-bezier(.19,1,.22,1)}
.acc:hover{color:#D6B083;padding-left:12px}
.acc .pl{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border:1px solid rgba(214,176,131,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#D6B083;transition:transform .6s cubic-bezier(.19,1,.22,1),background .4s}
.abody{padding:0 0 28px 62px;animation:openIn .8s cubic-bezier(.19,1,.22,1) both}
.simg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.1s ease,transform 3s cubic-bezier(.19,1,.22,1)}
.proc{position:relative;padding:28px 24px 30px 0;border-top:1px solid rgba(232,228,218,.15)}
.proc::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:#D6B083;transition:width .8s cubic-bezier(.19,1,.22,1)}
.proc:hover::before{width:100%}
.foot-wm{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(64px,16.5vw,250px);line-height:.85;text-align:center;color:transparent;-webkit-text-stroke:1px rgba(214,176,131,.38);margin:72px 0 28px;letter-spacing:-.02em;white-space:nowrap;user-select:none}
.flink{display:block;text-decoration:none;padding:6px 0;transition:color .3s}
.flink:hover{color:#D6B083}
@media (max-width:960px){
.nav-links,.hide-m{display:none!important}
.burger{display:inline-flex}
.wrap{padding:0 20px}
.chap{grid-template-columns:1fr;padding:0 20px}
.rail{border-right:0;border-top:1px solid rgba(214,176,131,.2);height:44px}
.rail .rn{left:0;right:auto;top:12px}
.rail .rv{writing-mode:horizontal-tb;transform:none;top:16px;left:44px;right:auto}
.cbody{padding-left:0}
.abody{padding-left:0}
.simgw{height:360px!important}
}
@media (prefers-reduced-motion:reduce){.kb,.grain-a,.ln>span,.fu,.abody,.mq{animation:none!important}}
</style>
</helmet>
<div class="at">
<div class="grain" aria-hidden="true" style="{{ grainStyle }}"></div>

<header style="position:absolute;top:0;left:0;right:0;z-index:40">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:24px;height:96px">
    <a href="Atlantico-Home.html" aria-label="Imonovo — Início" style="text-decoration:none;display:flex;align-items:center;gap:14px">
      <span style="display:block;width:28px;height:1px;background:#D6B083"></span>
      <span class="serif" style="font-size:21px;letter-spacing:.36em;font-weight:500">IMONOVO</span>
    </a>
    <nav class="nav-links" aria-label="Principal" style="display:flex;gap:32px;align-items:center">
      <a class="nl" href="Atlantico-Home.html">{{ t.home }}</a>
      <a class="nl" href="Atlantico-Imoveis.html">{{ t.imoveis }}</a>
      <a class="nl" href="Atlantico-Imoveis.html#empreendimentos">{{ t.emp }}</a>
      <a class="nl" href="Atlantico-Vender.html">{{ t.vender }}</a>
      <a class="nl" href="Atlantico-Servicos.html" aria-current="page" style="color:#D6B083">{{ t.serv }}</a>
      <a class="nl" href="Atlantico-Contactos.html">{{ t.cont }}</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px">
      <div role="group" aria-label="Idioma / Langue" style="display:flex;align-items:center">
        <button type="button" class="lg" style="{{ ptStyle }}" aria-pressed="{{ ptPressed }}" onClick="{{ setPT }}">PT</button>
        <span aria-hidden="true" style="width:1px;height:14px;background:rgba(232,228,218,.3)"></span>
        <button type="button" class="lg" style="{{ frStyle }}" aria-pressed="{{ frPressed }}" onClick="{{ setFR }}">FR</button>
      </div>
      <a href="Atlantico-Imoveis.html" class="icon-btn" aria-label="{{ favLabel }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20.5C9 18.6 3.9 15.2 2.9 11.3 2.1 8.1 4.1 5 7.2 5c2.1 0 3.7 1.3 4.8 3 1.1-1.7 2.7-3 4.8-3 3.1 0 5.1 3.1 4.3 6.3-1 3.9-6.1 7.3-9.1 9.2z"/></svg>
        <span class="badge num">{{ favCount }}</span>
      </a>
      <a href="Atlantico-Vender.html" class="btn btn-sm hide-m" style="margin-left:10px">{{ t.cta }}</a>
      <button type="button" class="icon-btn burger" aria-label="Menu" aria-expanded="{{ menuExp }}" onClick="{{ toggleMenu }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h18M3 16h18"/></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav wrap" aria-label="Menu móvel" style="background:#0F2126;padding-top:12px;padding-bottom:28px;border-top:1px solid rgba(214,176,131,.25)">
      <a href="Atlantico-Home.html">{{ t.home }}</a>
      <a href="Atlantico-Imoveis.html">{{ t.imoveis }}</a>
      <a href="Atlantico-Imoveis.html#empreendimentos">{{ t.emp }}</a>
      <a href="Atlantico-Vender.html">{{ t.vender }}</a>
      <a href="Atlantico-Servicos.html">{{ t.serv }}</a>
      <a href="Atlantico-Contactos.html">{{ t.cont }}</a>
    </nav>
  </sc-if>
</header>

<!-- HERO -->
<section style="position:relative;height:760px;overflow:hidden">
  <div style="position:absolute;inset:0;overflow:hidden"><img class="kb" src="assets/coast-village.webp" alt="Casas brancas sobre a praia (ilustrativa)" style="width:100%;height:100%;object-fit:cover;opacity:.75"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,21,24,.85) 0%,rgba(10,21,24,.35) 55%,rgba(10,21,24,.1) 100%),linear-gradient(180deg,rgba(10,21,24,.6) 0%,rgba(10,21,24,0) 30%,rgba(10,21,24,0) 70%,#0A1518 100%)"></div>
  <div class="grain grain-a" aria-hidden="true" style="z-index:2;opacity:.45"></div>
  <div class="wrap" style="position:relative;z-index:3;padding-top:220px">
    <p class="eyebrow fu d1" style="display:flex;align-items:center;gap:16px"><span style="display:block;width:40px;height:1px;background:#D6B083"></span>{{ t.eyebrow }}</p>
    <h1 class="disp" style="font-size:clamp(56px,8.4vw,136px);margin:28px 0 0;max-width:1000px">
      <span class="ln"><span class="d1">{{ t.h1a }}</span></span>
      <span class="ln"><span class="d2 it">{{ t.h1b }}</span></span>
    </h1>
    <p class="fu d4" style="max-width:500px;margin:32px 0 0;font-size:17px;line-height:1.7">{{ t.sub }}</p>
  </div>
</section>

<!-- 01 SERVIÇOS -->
<section id="ch-01" class="chap" style="padding-top:60px">
  <div class="rail"><span class="rn num">01</span><span class="rv">{{ t.c1 }}</span></div>
  <div class="cbody">
    <div role="tablist" aria-label="Tipos de serviço" style="display:flex;flex-wrap:wrap;gap:44px;border-bottom:1px solid rgba(232,228,218,.12);margin-bottom:12px">
      <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="2">
        <button type="button" role="tab" class="tab" style="{{ tb.style }}" aria-selected="{{ tb.pressed }}" onClick="{{ tb.pick }}">{{ tb.label }}<sup class="num">{{ tb.count }}</sup></button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:64px;align-items:start;margin-top:30px">
      <div>
        <p class="muted" style="margin:0 0 26px;max-width:520px">{{ tabIntro }}</p>
        <div style="border-bottom:1px solid rgba(232,228,218,.14)">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
            <div>
              <button type="button" class="acc" aria-expanded="{{ it.exp }}" onClick="{{ it.toggle }}" style="{{ it.style }}">
                <span class="num" style="font-size:15px;color:#D6B083;width:40px">{{ it.n }}</span>
                <span class="serif" style="font-size:30px;line-height:1.15">{{ it.name }}</span>
                <span class="pl" aria-hidden="true" style="{{ it.plStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 5v14M5 12h14"/></svg></span>
              </button>
              <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
                <div class="abody">
                  <p style="margin:0 0 16px;font-size:17px;max-width:540px;line-height:1.7">{{ it.text }}</p>
                  <a href="Atlantico-Contactos.html" class="nl" style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#D6B083">{{ t.ask }} →</a>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
      <figure style="margin:0">
        <div class="simgw" style="position:relative;height:720px;overflow:hidden;background:#0F2126">
          <sc-for list="{{ pics }}" as="pc" hint-placeholder-count="2">
            <img class="simg" src="{{ pc.src }}" alt="{{ pc.alt }}" style="{{ pc.style }}">
          </sc-for>
          <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,21,24,0) 50%,rgba(10,21,24,.85) 100%)"></div>
          <div style="position:absolute;left:32px;right:32px;bottom:30px" aria-live="polite">
            <p class="num" style="font-size:84px;line-height:1;margin:0;color:#D6B083">{{ curN }}</p>
            <p class="serif" style="font-size:30px;font-style:italic;margin:8px 0 0">{{ curName }}</p>
          </div>
        </div>
        <figcaption class="muted" style="display:flex;justify-content:space-between;font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:14px"><span>{{ figCap }}</span><span>Ilustrativa</span></figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- 02 FRANCÊS -->
<section id="ch-02" style="margin-top:170px;border-top:1px solid rgba(214,176,131,.28);border-bottom:1px solid rgba(214,176,131,.28);overflow:hidden;padding:34px 0" aria-label="Nous parlons français">
  <div class="mq" aria-hidden="true">
    <span class="serif" style="font-size:96px;font-style:italic;padding:0 40px;white-space:nowrap;line-height:1.1">Nous parlons français</span><span class="serif" style="font-size:96px;padding:0 40px;color:#D6B083">·</span>
    <span class="serif" style="font-size:96px;padding:0 40px;white-space:nowrap;line-height:1.1">Falamos português</span><span class="serif" style="font-size:96px;padding:0 40px;color:#D6B083">·</span>
    <span class="serif" style="font-size:96px;font-style:italic;padding:0 40px;white-space:nowrap;line-height:1.1">Nous parlons français</span><span class="serif" style="font-size:96px;padding:0 40px;color:#D6B083">·</span>
    <span class="serif" style="font-size:96px;padding:0 40px;white-space:nowrap;line-height:1.1">Falamos português</span><span class="serif" style="font-size:96px;padding:0 40px;color:#D6B083">·</span>
  </div>
</section>

<!-- 03 PROCESSO -->
<section id="ch-03" class="chap" style="padding-top:150px">
  <div class="rail"><span class="rn num">02</span><span class="rv">{{ t.c2 }}</span></div>
  <div class="cbody">
    <p class="eyebrow">{{ t.chapter }} 02</p>
    <h2 class="disp" style="font-size:clamp(44px,5.4vw,84px);margin:18px 0 56px">{{ t.procT1 }} <span class="it">{{ t.procT2 }}</span></h2>
    <ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:0 24px">
      <li class="proc"><span class="num" style="font-size:64px;line-height:1;color:#D6B083">01</span><h3 class="serif" style="font-size:26px;font-weight:400;margin:18px 0 8px">Conversa inicial</h3><p class="muted" style="margin:0;font-size:15px">Percebemos o seu projeto, prazos e o que já está tratado.</p></li>
      <li class="proc"><span class="num" style="font-size:64px;line-height:1;color:#D6B083">02</span><h3 class="serif" style="font-size:26px;font-weight:400;margin:18px 0 8px">Plano à medida</h3><p class="muted" style="margin:0;font-size:15px">Lista clara dos passos e documentos necessários.</p></li>
      <li class="proc"><span class="num" style="font-size:64px;line-height:1;color:#D6B083">03</span><h3 class="serif" style="font-size:26px;font-weight:400;margin:18px 0 8px">Tratamos de tudo</h3><p class="muted" style="margin:0;font-size:15px">Acompanhamos cada etapa e mantemo-lo informado.</p></li>
      <li class="proc"><span class="num" style="font-size:64px;line-height:1;color:#D6B083">04</span><h3 class="serif" style="font-size:26px;font-weight:400;margin:18px 0 8px">Chave na mão</h3><p class="muted" style="margin:0;font-size:15px">Casa pronta a viver — e cuidada depois, se quiser.</p></li>
    </ol>
  </div>
</section>

<!-- CTA -->
<section style="position:relative;margin-top:170px;height:600px;overflow:hidden">
  <img class="kb" src="assets/sea-dusk.webp" alt="Mar ao crepúsculo (ilustrativa)" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(10,21,24,.6)"></div>
  <div class="grain grain-a" aria-hidden="true" style="z-index:2;opacity:.4"></div>
  <div class="chap" style="position:relative;z-index:3;height:600px">
    <div class="rail" style="border-right-color:rgba(214,176,131,.35)"><span class="rn num" style="top:130px">03</span><span class="rv" style="top:178px;color:#E8E4DA">{{ t.c3 }}</span></div>
    <div class="cbody" style="padding-top:130px">
      <p class="eyebrow">{{ t.chapter }} 03</p>
      <h2 class="disp" style="font-size:clamp(52px,7vw,110px);margin:22px 0 28px">{{ t.ctaT1 }}<br><span class="it">{{ t.ctaT2 }}</span></h2>
      <div style="display:flex;flex-wrap:wrap;gap:14px">
        <a href="Atlantico-Contactos.html" class="btn">{{ t.ctaBtn }}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
        <a href="mailto:info@imonovo.pt" class="btn btn-g">info@imonovo.pt</a>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer style="position:relative;background:#081114;border-top:1px solid rgba(214,176,131,.25)">
  <div class="wrap" style="padding-top:90px;padding-bottom:36px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:48px">
      <div>
        <p class="serif" style="font-size:24px;letter-spacing:.34em;margin:0">IMONOVO</p>
        <p class="muted" style="margin:18px 0 0;max-width:280px;font-size:14px">Agência imobiliária em Caldas da Rainha — Costa de Prata, Oeste. Atendimento em português e francês.</p>
      </div>
