<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Azulejo — Imóveis</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Work+Sans:ital,wght@0,300..700;1,300..700&display=swap">
<style>
body{margin:0;background:#F7F3EA}
:root{--wash:#F7F3EA;--wash2:#EEE6D4;--paper:#FFFDF7;--cob:#1E3A8A;--cob2:#142A66;--cob3:#0D1C47;--terra:#B5552F;--terraInk:#9C4322;--gold:#D6B083;--ink:#18181B;--mute:#4A4A56;--line:rgba(20,42,102,.16)}
*{box-sizing:border-box}
.root{background:var(--wash);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;font-size:17px;line-height:1.6;overflow-x:clip}
.root img{display:block;max-width:100%}
.root a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.serif{font-family:'Gloock',Georgia,serif;font-weight:400}
.sc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin:0}
.smc{font-variant-caps:all-small-caps;letter-spacing:.1em;font-size:17px;color:var(--mute);margin:0}
.folio{display:inline-flex;align-items:center;gap:12px;font:400 15px 'Gloock',serif;color:var(--terraInk)}
.folio::before{content:"";width:32px;height:1px;background:currentColor}
.h2{font-size:clamp(40px,5vw,72px);line-height:1;margin:12px 0 0;color:var(--cob2);letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.az{background-color:#FBFAF6;background-image:radial-gradient(circle at 50% 50%,#1E3A8A 0 2.5px,transparent 3px),radial-gradient(circle at 50% 50%,transparent 0 7px,#1E3A8A 7.5px 9px,transparent 9.5px),radial-gradient(circle at 0 0,#1E3A8A 0 12px,transparent 12.5px),radial-gradient(circle at 100% 0,#1E3A8A 0 12px,transparent 12.5px),radial-gradient(circle at 0 100%,#1E3A8A 0 12px,transparent 12.5px),radial-gradient(circle at 100% 100%,#1E3A8A 0 12px,transparent 12.5px),conic-gradient(from 45deg at 50% 50%,#DCE3F3 0 25%,#FBFAF6 0 50%,#DCE3F3 0 75%,#FBFAF6 0);background-size:40px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 26px;border:1.5px solid var(--cob);background:var(--cob);color:#F7F3EA !important;font:600 14px/1 'Work Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .3s,color .3s,transform .3s,border-color .3s}
.btn:hover{background:var(--cob2);transform:translateY(-2px)}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--cob) !important}
.btn.ghost:hover{background:var(--cob);color:#F7F3EA !important}
.btn.terra{background:var(--terraInk);border-color:var(--terraInk)}
.btn.terra:hover{background:#7E3418;border-color:#7E3418}
.chip{min-height:44px;padding:0 16px;border:1.5px solid var(--cob);border-radius:999px;background:transparent;color:var(--cob);font:500 15px 'Work Sans',sans-serif;cursor:pointer;transition:background .3s,color .3s}
.chip:hover{background:rgba(30,58,138,.09)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--cob2)}
.inp{min-height:52px;width:100%;padding:12px 14px;border:0;border-bottom:1.5px solid var(--cob);border-radius:0;background:rgba(255,255,255,.7);font:16px 'Work Sans',sans-serif;color:var(--ink)}
.inp:focus{background:#fff;border-bottom-color:var(--terra)}
input[type=range]{width:100%;height:44px;accent-color:#1E3A8A;cursor:pointer}
.mast{position:relative;z-index:20;background:var(--wash)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 40px;max-width:1320px;margin:0 auto;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cob2);border-bottom:1px solid var(--line)}
.strip a{text-decoration:none;margin-left:20px}
.strip a:hover{color:var(--terraInk)}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 40px;max-width:1320px;margin:0 auto}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--cob2) !important}
.logo-tile{width:42px;height:42px;background-size:21px 21px;border:2px solid var(--cob);box-shadow:3px 3px 0 var(--gold)}
.logo b{font:400 34px/1 'Gloock',serif;letter-spacing:-.01em}
.links{display:flex;gap:2px}
.links a{position:relative;padding:12px 12px;text-decoration:none;font-size:15px;font-weight:500;color:var(--ink)}
.links a::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:2px;background:var(--terra);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.links a.on{color:var(--cob)}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1.5px solid var(--cob);border-radius:999px;overflow:hidden}
.lang button{min-width:48px;min-height:44px;border:0;background:transparent;font:600 13px 'Work Sans',sans-serif;letter-spacing:.08em;color:var(--cob);cursor:pointer;transition:background .3s,color .3s}
.ibtn{position:relative;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--cob);background:transparent;color:var(--cob);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s,color .3s}
.ibtn:hover{background:var(--cob);color:#F7F3EA}
.cnt{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--terraInk);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.burger{display:none}
.favpop{position:absolute;right:40px;top:calc(100% - 6px);width:340px;max-width:calc(100% - 32px);background:var(--paper);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(20,42,102,.35);padding:22px;z-index:30;animation:fadeUp .35s both;display:flex;flex-direction:column;gap:12px}
.favrow{display:flex;gap:12px;align-items:center;text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line)}
.favrow img{width:56px;height:56px;object-fit:cover}
.mnav{display:flex;flex-direction:column;padding:8px 24px 24px;border-top:1px solid var(--line);animation:fadeUp .35s both}
.mnav a{padding:14px 0;font:400 28px 'Gloock',serif;text-decoration:none;color:var(--cob2);border-bottom:1px solid var(--line)}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes reveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.02)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(.4);opacity:0}100%{transform:translate(-50%,-100%) scale(1);opacity:1}}
.rise{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}
.badge{position:absolute;display:block;border-radius:50%;z-index:6;transition:transform .5s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 18px 30px rgba(20,42,102,.3))}
.badge:hover{transform:scale(1.07) rotate(-6deg)}
.badge .ring{width:100%;height:100%;display:block;animation:spin 28s linear infinite}
.badge:hover .ring{animation-duration:9s}
.badge .core{position:absolute;inset:27%;border-radius:50%;background:var(--wash);display:flex;align-items:center;justify-content:center;border:2px solid var(--gold)}
/* opener */
.opener{padding-top:40px;padding-bottom:30px}
.op-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:64px;align-items:end}
.op-h{font:400 clamp(64px,9vw,148px)/.86 'Gloock',serif;margin:18px 0 26px;color:var(--cob2);letter-spacing:-.03em}
.op-h span{color:var(--terra)}
.op-lead{max-width:600px;font-size:18px;color:#2B2B33;margin:0}
.drop::first-letter{float:left;font:400 66px/.82 'Gloock',serif;color:#F7F3EA;background:var(--cob);padding:12px 12px 8px;margin:6px 14px 0 0;box-shadow:4px 4px 0 var(--gold)}
.op-side{position:relative}
.op-photo{padding:18px;animation:reveal 1.2s cubic-bezier(.7,0,.2,1) both;transform:rotate(1.5deg)}
.op-photo img{width:100%;height:360px;object-fit:cover;animation:kb 8s both}
.op-side .badge{width:150px;height:150px;left:-56px;bottom:-40px}
.op-toc{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.op-toc a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);text-decoration:none;font-size:15px;transition:border-color .3s,background .3s}
.op-toc a:hover{border-color:var(--cob);background:var(--paper)}
.op-toc b{font:400 16px 'Gloock',serif;color:var(--terraInk)}
/* catalog */
.cat{padding-top:70px}
.cat-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;align-items:start}
.filters{position:sticky;top:16px;background:var(--paper);border:1.5px solid var(--cob);padding:26px 24px;display:flex;flex-direction:column;gap:26px}
.filters::before{content:"";display:block;height:18px;margin:-26px -24px 4px;background:radial-gradient(circle,#D6B083 0 2px,transparent 2.5px) 0 0/14px 14px,#1E3A8A}
.f-group{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.f-group legend{padding:0;margin-bottom:10px}
.f-chips{display:flex;gap:8px;flex-wrap:wrap}
.f-val{font:400 28px 'Gloock',serif;color:var(--cob2)}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:2px solid var(--cob2)}
.count{font:400 clamp(40px,4vw,60px)/1 'Gloock',serif;color:var(--cob2);margin:6px 0 0}
.count span{color:var(--terra)}
.tb-right{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.views{display:flex;border:1.5px solid var(--cob)}
.views button{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 16px;border:0;background:transparent;color:var(--cob);font:500 14px 'Work Sans',sans-serif;cursor:pointer;transition:background .3s,color .3s}
.views button + button{border-left:1.5px solid var(--cob)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:34px;margin-top:34px}
.tile{position:relative;height:480px;perspective:1600px;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.75,.2,1)}
.tile:hover .flip-in,.flip-in:focus-within{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.front{padding:12px;box-shadow:0 26px 50px -30px rgba(20,42,102,.55)}
.fr-img{position:relative;flex:1;overflow:hidden;background:#DCE3F3}
.fr-img img{width:100%;height:100%;object-fit:cover}
.fr-cap{background:var(--paper);padding:14px 16px;display:flex;align-items:baseline;gap:12px}
.fr-no{font:400 15px 'Gloock',serif;color:var(--terraInk)}
.fr-loc{font:400 22px/1.1 'Gloock',serif;color:var(--cob2);flex:1}
.fr-price{font-weight:600;font-size:15px}
.tag-red{position:absolute;left:14px;top:14px;background:var(--terraInk);color:#fff;padding:7px 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.back{transform:rotateY(180deg);background:var(--cob2);color:#F7F3EA;padding:30px;justify-content:space-between;overflow:hidden;border:12px solid #FBFAF6;outline:2px solid var(--cob);outline-offset:-14px}
.back::before{content:"";position:absolute;inset:0;background:url(assets/az-tile-pattern.webp) center/320px;opacity:.1}
.back > *{position:relative}
.back h3{font:400 32px/1.05 'Gloock',serif;margin:10px 0 0}
.back .sc{color:var(--gold)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}
.specs dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C9D1E6}
.specs dd{margin:2px 0 0;font:400 22px 'Gloock',serif}
.b-price{font:400 40px/1 'Gloock',serif;color:var(--gold);margin:0}
.b-link{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;background:#F7F3EA;color:var(--cob2) !important;text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;align-self:flex-start;transition:background .3s}
.b-link:hover{background:var(--gold)}
.fav{position:absolute;top:24px;right:24px;z-index:7;width:48px;height:48px;border-radius:50%;border:0;background:rgba(251,250,246,.95);color:var(--terraInk);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .3s,background .3s,color .3s;box-shadow:0 6px 18px rgba(13,28,71,.25)}
.fav:hover{transform:scale(1.1)}
/* list view */
.rows{display:flex;flex-direction:column;margin-top:10px}
.row{position:relative;display:grid;grid-template-columns:70px 220px minmax(0,1fr) auto;gap:26px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);animation:fadeUp .6s both;transition:background .35s}
.row:hover{background:var(--paper)}
.row-no{font:400 34px 'Gloock',serif;color:var(--terraInk);padding-left:8px}
.row-img{height:150px;overflow:hidden;padding:8px}
.row-img img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.row:hover .row-img img{transform:scale(1.06)}
.row h3{font:400 30px/1.1 'Gloock',serif;margin:0;color:var(--cob2)}
.row h3 a{text-decoration:none}
.row h3 a:hover{color:var(--terraInk)}
.row-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:15px;color:var(--mute)}
.row-r{display:flex;align-items:center;gap:16px;padding-right:8px}
.row-price{font:400 28px 'Gloock',serif;color:var(--ink);white-space:nowrap}
.row .fav{position:static;box-shadow:none;border:1.5px solid var(--terraInk)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:30px;margin-top:30px;align-items:start}
.map{position:relative;height:620px;padding:14px}
.map-in{position:relative;width:100%;height:100%;overflow:hidden;background:#FBFAF6}
.map-in svg{position:absolute;inset:0;width:100%;height:100%}
.town{position:absolute;transform:translate(-50%,-50%);font:400 15px 'Gloock',serif;color:var(--cob2);white-space:nowrap;pointer-events:none}
.town.sea{color:#F7F3EA;font:600 11px 'Work Sans',sans-serif;letter-spacing:.3em;text-transform:uppercase}
.pin{position:absolute;transform:translate(-50%,-100%);width:46px;height:56px;border:0;padding:0;background:transparent;cursor:pointer;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;transition:filter .3s}
.pin:hover{filter:drop-shadow(0 6px 10px rgba(13,28,71,.4))}
.pin svg{width:100%;height:100%;display:block}
.pin b{position:absolute;left:0;right:0;top:11px;text-align:center;font:600 12px 'Work Sans',sans-serif;color:#F7F3EA}
.map-card{background:var(--cob2);color:#F7F3EA;padding:16px;animation:fadeUp .5s both}
.map-card img{width:100%;height:220px;object-fit:cover}
.map-card h3{font:400 30px/1.1 'Gloock',serif;margin:16px 0 6px}
.map-card p{margin:0 0 6px;color:#D5DBEA;font-size:15px}
.map-card .b-price{margin:12px 0 16px}
.empty{margin-top:34px;padding:56px 40px;border:1.5px dashed var(--cob);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--paper)}
.empty h3{font:400 34px 'Gloock',serif;margin:0;color:var(--cob2)}
.roofline{display:block;line-height:0;margin-top:120px}
.roofline svg{display:block;width:100%;height:90px}
/* developments */
.dev{background:var(--cob2);color:#F7F3EA;padding:100px 0 120px;scroll-margin-top:20px}
.dev .folio{color:var(--gold)}
.dev .h2{color:#F7F3EA}
.dev-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.dev .chip{border-color:rgba(247,243,234,.55);color:#F7F3EA}
.dev .chip:hover{background:rgba(247,243,234,.1)}
.dev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:34px;margin-top:44px}
.dev-card{position:relative;background:#FBFAF6;color:var(--ink);padding:14px 14px 22px;animation:fadeUp .6s both;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.dev-card:nth-child(odd){transform:rotate(-1deg)}
.dev-card:nth-child(even){transform:rotate(1deg)}
.dev-card:hover{transform:rotate(0) translateY(-6px)}
.dev-card img{width:100%;height:260px;object-fit:cover}
.stamp{position:absolute;right:26px;top:212px;width:104px;height:104px;border-radius:50%;background:var(--terraInk);color:#F7F3EA;display:flex;align-items:center;justify-content:center;text-align:center;font:600 11px/1.25 'Work Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:12px;transform:rotate(-12deg);border:3px double #F7F3EA;box-shadow:0 10px 20px rgba(13,28,71,.3)}
.dev-card h3{font:400 26px/1.1 'Gloock',serif;margin:18px 0 6px;color:var(--cob2);padding-right:110px}
.dev-card p{margin:0 0 14px;font-size:15px;color:var(--mute)}
.dev-card a{font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--cob) !important;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.dev-card a:hover{color:var(--terraInk) !important}
.dev-note{margin:24px 0 0;font-size:14px;color:#C9D1E6}
.after{padding:100px 0 120px}
.after-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:30px;align-items:center;border-top:2px solid var(--cob2);border-bottom:2px solid var(--cob2);padding:40px 0}
.after-box h2{font:400 clamp(36px,4vw,56px)/1.02 'Gloock',serif;margin:0;color:var(--cob2)}
.after-acts{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.foot{background:var(--cob2);color:#F7F3EA;font-size:15px}
.foot-az{height:28px;background-size:28px 28px}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:40px;padding-top:70px;padding-bottom:50px}
.foot .logo{color:#F7F3EA !important}
.foot p,.foot address{margin:0 0 10px;font-style:normal;color:#D5DBEA;line-height:1.75}
.foot .sc{color:var(--gold);margin-bottom:16px}
.foot ul{list-style:none;margin:0;padding:0}
.foot li a,.foot address a,.foot-links a{text-decoration:none;display:inline-block;padding:3px 0;color:#F7F3EA}
.foot li a:hover,.foot address a:hover,.foot-links a:hover{color:var(--gold)}
.foot-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;padding-bottom:28px;border-top:1px solid rgba(247,243,234,.22);font-size:13px;color:#C9D1E6}
@media (max-width:1100px){.cat-grid{grid-template-columns:1fr}.filters{position:relative;top:0}.mapwrap{grid-template-columns:1fr}}
@media (max-width:980px){.links{display:none}.burger{display:inline-flex}.op-grid{grid-template-columns:1fr}.strip-mid{display:none}}
@media (max-width:760px){.wrap,.navbar,.strip{padding-left:16px;padding-right:16px}.row{grid-template-columns:1fr;gap:12px}.row-no{display:none}.row-img{height:220px}.map{height:480px;padding:8px}.op-side .badge{left:auto;right:0;bottom:-30px;width:120px;height:120px}.logo b{font-size:28px}.favpop{right:16px}.tile{height:440px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="root">

<header class="mast">
  <div class="strip">
    <span>{{ t.issue }}</span>
    <span class="strip-mid">Revista Imonovo · Nº 01 · Secção 02</span>
    <span><a href="index.html">{{ t.all }}</a><a href="tel:+351919192220">+351 919 192 220</a></span>
  </div>
  <div class="navbar">
    <a class="logo" href="Azulejo-Home.html" aria-label="Imonovo, início">
      <span class="logo-tile az" aria-hidden="true"></span>
      <b>Imonovo</b>
    </a>
    <nav class="links" aria-label="Principal">
      <a href="Azulejo-Home.html">{{ t.n1 }}</a>
      <a class="on" href="Azulejo-Imoveis.html" aria-current="page">{{ t.n2 }}</a>
