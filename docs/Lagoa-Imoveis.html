<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lagoa — Imóveis</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0;background:#F5F1E8}
.lg{--ground:#F5F1E8;--card:#FBF9F4;--ink:#1E2A28;--muted:#4C5754;--teal:#2D6A64;--gold:#D6B083;--sand:#E7DCC8;--line:rgba(30,42,40,.12);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.lg *,.lg *::before,.lg *::after{box-sizing:border-box}
.lg img{display:block;max-width:100%}
.lg h1,.lg h2,.lg h3,.lg h4,.lg p{margin:0}
.lg a{color:inherit}
.lg button,.lg input,.lg select,.lg textarea{font-family:inherit}
.lg a:focus-visible,.lg button:focus-visible,.lg input:focus-visible,.lg select:focus-visible,.lg textarea:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.015em}
.it{font-style:italic;color:var(--teal)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.eyebrow::before{content:'';width:20px;height:10px;border:1.5px solid var(--gold);border-bottom:0;border-radius:20px 20px 0 0}
.muted{color:var(--muted)}
.h2{font-size:clamp(40px,4.6vw,68px);line-height:1.02;letter-spacing:-.02em}
.sec{padding:120px 0 0}
.sec-head{display:flex;flex-direction:column;gap:18px;max-width:720px}
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:0;border-radius:26px 26px 8px 8px;font-size:15px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s,box-shadow .4s,color .3s}
.btn svg{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg{transform:translateX(4px)}
.btn-teal{background:var(--teal);color:#FBF9F4;box-shadow:0 16px 30px -18px rgba(45,106,100,.9)}
.btn-teal:hover{background:#22524D;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(30,42,40,.28)}
.btn-ghost:hover{color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.card{background:var(--card);border-radius:28px;box-shadow:0 30px 60px -44px rgba(30,42,40,.5)}
.wave{display:block;width:100%;height:46px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:22px 22px 6px 6px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(30,42,40,.16);transition:background .3s,color .3s,box-shadow .3s,transform .3s}
.chip:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--teal)}
.chip-n{font-size:12px;opacity:.75}
/* header */
.strip{background:var(--ink);color:#EDE6D8;font-size:12.5px;letter-spacing:.04em}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.strip a{display:inline-flex;align-items:center;gap:6px;min-height:38px;text-decoration:none;color:#EDE6D8;transition:color .3s}
.strip a:hover{color:var(--gold)}
.hdr{position:sticky;top:0;z-index:40;background:rgba(245,241,232,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;min-height:80px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{color:var(--teal)}
.logo-w{font-family:'Instrument Serif',Georgia,serif;font-size:31px;line-height:1;letter-spacing:-.01em}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nl{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14.5px;font-weight:500;text-decoration:none;border-radius:22px 22px 6px 6px;transition:background .3s,color .3s}
.nl:hover{background:rgba(45,106,100,.08);color:var(--teal)}
.nl.on{color:var(--teal)}
.nl.on::after{content:'';position:absolute;left:50%;bottom:3px;width:14px;height:7px;margin-left:-7px;border:1.5px solid var(--gold);border-bottom:0;border-radius:14px 14px 0 0}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.lang button{min-width:44px;min-height:40px;border:0;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .3s,color .3s}
.fav-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s,color .3s}
.fav-btn:hover{transform:translateY(-2px);color:var(--teal)}
.fav-n{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.menu-btn{display:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--ink);color:#FBF9F4;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
@media (max-width:1100px){.nav-links,.hdr-cta{display:none}.menu-btn{display:inline-flex}.tools{margin-left:auto}.mnav{display:grid;gap:4px;padding:8px 20px 20px}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:22px 22px 6px 6px;background:var(--card);text-decoration:none;font-weight:600}}
@media (max-width:700px){.wrap{padding:0 20px}.strip-txt{display:none}.strip-in{justify-content:flex-end}}
/* footer */
.ftr{position:relative;margin-top:140px;padding:120px 0 36px;background:var(--sand);border-radius:50% 50% 0 0/110px 110px 0 0}
.ftr-big{font-size:clamp(46px,6.4vw,96px);line-height:1;text-align:center;letter-spacing:-.025em}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;margin-top:72px;padding-top:48px;border-top:1px solid rgba(30,42,40,.16)}
.ftr h4{margin-bottom:16px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#24564F}
.ftr-col{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ftr-col a{display:inline-flex;align-items:center;gap:8px;min-height:32px;text-decoration:none;transition:color .3s}
.ftr-col a:hover{color:#24564F}
.ftr address{font-style:normal}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(30,42,40,.16);font-size:13px;color:#3E4946}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-16px) rotate(.6deg)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(1.6deg)}50%{transform:translateY(14px) rotate(-.4deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes archIn{from{clip-path:inset(100% 0 0 0 round 300px 300px 20px 20px)}to{clip-path:inset(0 0 0 0 round 300px 300px 20px 20px)}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.float-a{animation:floatA 7s ease-in-out infinite}
.float-b{animation:floatB 8.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.lg *{animation:none!important;transition:none!important}}
/* page hero */
.phero{position:relative;padding:64px 0 40px;background:radial-gradient(800px 460px at 80% 0%,rgba(214,176,131,.3),transparent 70%)}
.phero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:end}
.p-title{font-size:clamp(52px,6vw,96px);line-height:.95;letter-spacing:-.03em;margin-top:18px}
.p-title em{font-style:italic;color:var(--teal)}
.p-sub{margin-top:22px;font-size:17.5px;color:var(--muted);max-width:520px}
.trio{position:relative;height:420px}
.trio .a{position:absolute;overflow:hidden;border-radius:999px 999px 16px 16px;border:7px solid var(--card);box-shadow:0 40px 60px -36px rgba(30,42,40,.55)}
.trio img{width:100%;height:100%;object-fit:cover}
.trio .a1{left:22%;top:0;width:240px;height:400px;animation:archIn 1.5s cubic-bezier(.2,.7,.2,1) both}
.trio .a2{left:0;bottom:10px;width:160px;height:220px}
.trio .a3{right:0;top:60px;width:170px;height:240px}
@media (max-width:900px){.phero-grid{grid-template-columns:1fr}.trio{height:340px}.trio .a1{width:200px;height:330px}}
/* filters */
.filters{margin-top:40px;padding:28px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:26px 32px}
.fg{display:flex;flex-direction:column;gap:12px}
.fg-l{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fg-chips{display:flex;flex-wrap:wrap;gap:8px}
.range-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.range-v{font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1;color:var(--teal)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:18px 0;border-radius:6px;cursor:pointer}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:32px;border-radius:13px 13px 6px 6px;background:var(--teal);border:3px solid #FBF9F4;box-shadow:0 8px 16px -6px rgba(30,42,40,.6);cursor:pointer}
.range::-moz-range-thumb{width:22px;height:28px;border-radius:13px 13px 6px 6px;background:var(--teal);border:3px solid #FBF9F4;cursor:pointer}
.range-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:28px}
.count{display:flex;align-items:baseline;gap:10px}
.count b{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:46px;line-height:1;color:var(--teal)}
.tb-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sort{display:inline-flex;flex-wrap:wrap;gap:6px;padding:4px;border-radius:26px 26px 10px 10px;background:var(--sand)}
.sort button{min-height:42px;padding:0 14px;border:0;border-radius:20px 20px 6px 6px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .3s,color .3s}
.views{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.views button{width:46px;height:44px;border:0;border-radius:999px;display:grid;place-items:center;cursor:pointer;transition:background .3s,color .3s}
.reset{min-height:44px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--teal);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
/* cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:28px;margin-top:36px}
.pcard{position:relative;display:flex;flex-direction:column;padding:12px 12px 24px;border-radius:30px;background:var(--card);box-shadow:0 30px 60px -44px rgba(30,42,40,.5);transition:transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .6s;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.pcard:hover{transform:translateY(-8px);box-shadow:0 46px 70px -42px rgba(30,42,40,.55)}
.pc-media{position:relative}
.pc-img{display:block;height:330px;border-radius:999px 999px 18px 18px;overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .pc-img img,.lcard:hover .pc-img img{transform:scale(1.07)}
.pc-fav{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(251,249,244,.95);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s,color .3s}
.pc-fav:hover{transform:scale(1.1);color:var(--teal)}
.pc-badge{position:absolute;left:14px;bottom:18px;padding:7px 14px;border-radius:999px;background:var(--ink);color:#FBF9F4;font-size:12px;font-weight:600;letter-spacing:.04em}
.pc-body{display:flex;flex-direction:column;gap:8px;padding:20px 14px 0}
.pc-loc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.pc-t{font-size:31px;line-height:1.05;text-decoration:none;transition:color .3s}
.pc-t:hover{color:var(--teal)}
.pc-meta{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--muted)}
.pc-meta span{display:inline-flex;align-items:center;gap:6px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:16px;border-top:1px dashed rgba(30,42,40,.2)}
.pc-price{font-size:21px;font-weight:700;letter-spacing:-.01em}
.pc-go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ground);color:var(--teal);transition:background .3s,color .3s,transform .4s}
.pcard:hover .pc-go,.lcard:hover .pc-go{background:var(--teal);color:#FBF9F4;transform:rotate(-45deg)}
.llist{display:flex;flex-direction:column;gap:18px;margin-top:36px}
.lcard{display:grid;grid-template-columns:300px minmax(0,1fr) auto;gap:32px;align-items:center;padding:12px 32px 12px 12px;border-radius:30px;background:var(--card);box-shadow:0 30px 60px -48px rgba(30,42,40,.5);transition:transform .5s cubic-bezier(.2,.7,.2,1);animation:rise .6s both}
.lcard:hover{transform:translateX(6px)}
.lcard .pc-img{height:230px}
.lc-side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
@media (max-width:860px){.lcard{grid-template-columns:1fr;padding:12px 12px 24px}.lc-side{align-items:flex-start;padding:0 14px}}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;margin-top:36px}
.map{position:relative;height:600px;border-radius:999px 999px 30px 30px;overflow:hidden;background:#EDE5D6;box-shadow:inset 0 0 0 1px var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.town{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3E4946;white-space:nowrap;pointer-events:none}
.town.water{color:#24564F;font-style:italic;font-family:'Instrument Serif',Georgia,serif;font-size:20px;letter-spacing:0;text-transform:none;font-weight:400}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;border:0;background:transparent;padding:0;cursor:pointer;min-width:44px;min-height:44px;transition:transform .35s cubic-bezier(.2,.7,.2,1);z-index:2}
.pin:hover{transform:translate(-50%,-100%) translateY(-4px)}
.pin-tag{display:block;padding:7px 12px 6px;border-radius:16px 16px 6px 6px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 10px 20px -10px rgba(30,42,40,.6);transition:background .3s,color .3s}
.pin-dot{position:relative;width:10px;height:10px;margin-top:4px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px #FBF9F4}
.pin-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--teal);animation:ping 2.2s ease-out infinite}
.map-side{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px;border:0;border-radius:20px;background:var(--card);text-align:left;cursor:pointer;color:var(--ink);transition:background .3s,box-shadow .3s,transform .3s}
.mrow:hover{transform:translateX(4px)}
.mrow-img{width:72px;height:86px;border-radius:999px 999px 10px 10px;overflow:hidden}
.mrow-img img{width:100%;height:100%;object-fit:cover}
.mrow-t{display:block;font-family:'Instrument Serif',Georgia,serif;font-size:22px;line-height:1.1}
.mrow-l{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.mrow-p{font-weight:700;font-size:14.5px;white-space:nowrap}
@media (max-width:980px){.mapwrap{grid-template-columns:1fr}.map{height:460px}}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:36px;padding:64px 24px;border-radius:999px 999px 30px 30px;background:var(--card);text-align:center;animation:fade .6s both}
.empty h3{font-size:40px;line-height:1}
.empty p{max-width:440px;color:var(--muted)}
/* empreendimentos */
.emp{position:relative;margin-top:140px;padding:110px 0 120px;background:var(--card);border-radius:50% 50% 0 0/90px 90px 0 0}
.emp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:36px}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:24px;margin-top:40px}
.ecard{display:flex;flex-direction:column;gap:14px;animation:rise .6s both}
.e-img{position:relative;height:300px;border-radius:999px 999px 20px 20px;overflow:hidden;background:var(--sand)}
.e-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ecard:hover .e-img img{transform:scale(1.07)}
.e-st{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(251,249,244,.95);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.e-t{font-size:28px;line-height:1.1}
.e-m{font-size:14.5px;color:var(--muted)}
.e-a{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:700;color:var(--teal);text-decoration:none}
.e-a:hover{text-decoration:underline;text-underline-offset:4px}
.e-note{margin-top:28px;font-size:13.5px;color:var(--muted)}
</style>
</helmet>
<div class="lg" style="{{ rootStyle }}">

<div class="strip">
  <div class="wrap strip-in">
    <span class="strip-txt">{{ t.strip }}</span>
    <a href="index.html"><span>{{ t.allProps }}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</div>
<header class="hdr">
  <div class="wrap hdr-in">
    <a href="Lagoa-Home.html" class="logo" aria-label="Imonovo — início">
      <svg width="26" height="32" viewBox="0 0 26 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 31V13a11.5 11.5 0 0 1 23 0v18"/><path d="M7.5 31V14.5a5.5 5.5 0 0 1 11 0V31"/><path d="M0 31h26"/></svg>
      <span class="logo-w">Imonovo</span>
    </a>
    <nav class="nav-links" aria-label="Principal">
      <a class="nl" href="Lagoa-Home.html">{{ t.nav.home }}</a>
      <a class="nl on" href="Lagoa-Imoveis.html" aria-current="page">{{ t.nav.imoveis }}</a>
      <a class="nl" href="Lagoa-Imoveis.html#empreendimentos">{{ t.nav.emp }}</a>
      <a class="nl" href="Lagoa-Vender.html">{{ t.nav.vender }}</a>
      <a class="nl" href="Lagoa-Servicos.html">{{ t.nav.serv }}</a>
      <a class="nl" href="Lagoa-Contactos.html">{{ t.nav.cont }}</a>
    </nav>
    <div class="tools">
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" style="{{ ptStyle }}" aria-pressed="{{ ptPressed }}" onClick="{{ setPT }}">PT</button>
        <button type="button" style="{{ frStyle }}" aria-pressed="{{ frPressed }}" onClick="{{ setFR }}">FR</button>
      </div>

        fA:'À bientôt,', fB:'au bord de la lagune.', fDesc:'Agence immobilière à Caldas da Rainha, entre Óbidos, Foz do Arelho et Nazaré.', fContact:'Contact', fNav:'Naviguer', fCompany:'Société'
      }
    };
    const t = T[L];

    const P = [
      {id:1, type:'moradia', typo:'T5', loc:'Nadadouro', area:301, price:1380000, img:'assets/villa-modern-pool.webp', reduced:false, x:47.5, y:56.5,
        pt:'Vista mar e Lagoa de Óbidos, piscina aquecida, construída em 2014.', fr:'Vue mer et lagune d’Óbidos, piscine chauffée, construite en 2014.'},
      {id:2, type:'moradia', typo:'T3', loc:'Serra do Bouro', area:177, price:645000, img:'assets/villa-white.webp', reduced:false, x:41, y:36,
        pt:'Entre o campo e o mar, na Serra do Bouro.', fr:'Entre campagne et mer, à la Serra do Bouro.'},
      {id:3, type:'moradia', typo:'T3', loc:'Caldas da Rainha', area:195, price:780000, img:'assets/villa-yellow-pool.webp', reduced:false, x:68, y:48,
        pt:'Moradia com piscina, perto do centro de Caldas.', fr:'Villa avec piscine, près du centre de Caldas.'},
      {id:4, type:'moradia', typo:'T3', loc:'Caldas da Rainha', area:131, price:670000, img:'assets/house-white.webp', reduced:false, x:76, y:56,
        pt:'Casa caiada e luminosa, em Caldas da Rainha.', fr:'Maison blanche et lumineuse, à Caldas da Rainha.'},
      {id:5, type:'moradia', typo:'T3', loc:'Nadadouro', area:183, price:650000, img:'assets/villa-pool.webp', reduced:true, x:57, y:60,
        pt:'Preço reduzido, a poucos passos da lagoa.', fr:'Prix réduit, à quelques pas de la lagune.'},
      {id:6, type:'apartamento', typo:'T3', loc:'Caldas da Rainha', area:94, price:344000, img:'assets/int-living.webp', reduced:false, x:70, y:38,
        pt:'Apartamento T3 no centro da cidade.', fr:'Appartement T3 en centre-ville.'}
    ];
    const isFav = id => s.favs.indexOf(id) > -1;

    const mk = (key, opts) => opts.map(o => ({ label:o[1], pressed:String(s[key] === o[0]), style: s[key] === o[0] ? chipOn : '', pick: () => this.setState({ [key]: o[0] }) }));
    const typeChips = mk('type', [['all', t.all], ['moradia', t.moradias], ['apartamento', t.apart], ['terreno', t.terrenos]]);
    const typoChips = mk('typo', [['all', t.allF], ['T3', 'T3'], ['T5', 'T5']]);
    const locChips = mk('loc', [['all', t.allF], ['Caldas da Rainha', 'Caldas da Rainha'], ['Nadadouro', 'Nadadouro'], ['Serra do Bouro', 'Serra do Bouro']]);
    const sorts = [['recent', t.sRecent], ['asc', t.sAsc], ['desc', t.sDesc], ['area', t.sArea]].map(o => ({
      label:o[1], pressed:String(s.sort === o[0]), style: s.sort === o[0] ? on : off, pick: () => this.setState({ sort:o[0] }) }));
    const views = [
      ['grid', t.vGrid, 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
      ['list', t.vList, 'M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1'],
      ['map', t.vMap, 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14']
    ].map(v => ({ label:v[1], d:v[2], pressed:String(s.view === v[0]), style: s.view === v[0] ? on : off, pick: () => this.setState({ view:v[0] }) }));

    let res = P.filter(p => (s.type === 'all' || p.type === s.type) && (s.typo === 'all' || p.typo === s.typo) &&
      (s.loc === 'all' || p.loc === s.loc) && p.price <= s.max && (!s.onlyFav || isFav(p.id)));
    if (s.sort === 'asc') res = res.slice().sort((a, b) => a.price - b.price);
    if (s.sort === 'desc') res = res.slice().sort((a, b) => b.price - a.price);
    if (s.sort === 'area') res = res.slice().sort((a, b) => b.area - a.area);
    const selId = res.some(p => p.id === s.sel) ? s.sel : (res[0] ? res[0].id : 0);

    const results = res.map(p => {
      const f = isFav(p.id), sel = p.id === selId;
      const title = (p.type === 'moradia' ? (fr ? 'Villa ' : 'Moradia ') : (fr ? 'Appartement ' : 'Apartamento ')) + p.typo;
      return Object.assign({}, p, {
        title: title, alt: title + ' — ' + p.loc, priceF: fmt(p.price), areaF: p.area + ' m²', line: p[L],
        locFull: p.loc === 'Caldas da Rainha' ? p.loc : p.loc + ' · Caldas da Rainha',
        short: p.price >= 1000000 ? (p.price / 1000000).toFixed(2).replace('.', ',') + ' M€' : Math.round(p.price / 1000) + ' k€',
        reducedLabel: t.reduced, seeLabel: t.see,
        favPressed: String(f), heartFill: f ? 'currentColor' : 'none', favLabel: f ? t.remFav : t.addFav,
        favStyle: f ? 'color:var(--teal);' : '', favStyleList: 'position:static;' + (f ? 'color:var(--teal);' : '') + 'box-shadow:inset 0 0 0 1px rgba(30,42,40,.16);',
        toggleFav: () => this.setState({ favs: f ? s.favs.filter(x => x !== p.id) : s.favs.concat(p.id) }),
        pinPos: 'left:' + p.x + '%;top:' + p.y + '%;' + (sel ? 'z-index:3;' : ''),
        pinStyle: sel ? 'background:var(--teal);color:#FBF9F4;' : 'background:#FBF9F4;color:var(--ink);',
        rowStyle: sel ? 'box-shadow:inset 0 0 0 2px var(--teal);background:#FFFDF8;' : '',
        selPressed: String(sel), select: () => this.setState({ sel: p.id })
      });
    });
    const n = results.length;
    const selP = results.find(r => r.id === selId);

    const ES = [
      ['novo', 'Novo', 'Neuf', 'assets/villas-aerial.webp'],
      ['usado', 'Usado', 'Ancien', 'assets/white-blue-house.webp'],
      ['construcao', 'Em construção', 'En construction', 'assets/villa-infinity.webp'],
      ['recuperar', 'Para recuperar', 'À rénover', 'assets/countryside-fog.webp'],
      ['renovado', 'Renovado', 'Rénové', 'assets/villa-arcades.webp'],
      ['projeto', 'Em projeto', 'En projet', 'assets/coast-village.webp']
    ];
    const empChips = [['all', fr ? 'Tous' : 'Todos', ES.length]].concat(ES.map(e => [e[0], fr ? e[2] : e[1], 1])).map(o => ({
      label:o[1], n:String(o[2]), pressed:String(s.emp === o[0]), style: s.emp === o[0] ? chipOn : '', pick: () => this.setState({ emp:o[0] }) }));
    const emps = ES.filter(e => s.emp === 'all' || e[0] === s.emp).map(e => ({ img:e[3], label: fr ? e[2] : e[1], alt: fr ? e[2] : e[1], cta: t.empCta }));

    const pct = (s.max - 300000) / (1400000 - 300000) * 100;
    return {
      t: t, rootStyle: '--teal:' + accent + ';',
      ptStyle: L === 'pt' ? on : off, frStyle: fr ? on : off, ptPressed: String(!fr), frPressed: String(fr),
      setPT: () => this.setState({ lang:'pt' }), setFR: () => this.setState({ lang:'fr' }),
      favCount: s.favs.length, menuOpen: s.menu, menuExpanded: String(s.menu), toggleMenu: () => this.setState({ menu: !s.menu }),
      showFavs: () => this.setState({ onlyFav: true }),
      typeChips: typeChips, typoChips: typoChips, locChips: locChips, sorts: sorts, views: views,
      max: s.max, maxLabel: s.max >= 1400000 ? (fr ? 'Sans limite' : 'Sem limite') : fmt(s.max),
      rangeStyle: 'background:linear-gradient(90deg,var(--teal) ' + pct + '%,var(--sand) ' + pct + '%);',
      setMax: e => this.setState({ max: Number(e.target.value) }),
      favChipStyle: s.onlyFav ? chipOn : '', favPressed: String(s.onlyFav), favChipFill: s.onlyFav ? 'currentColor' : 'none',
      toggleOnlyFav: () => this.setState({ onlyFav: !s.onlyFav }),
      reset: () => this.setState({ type:'all', typo:'all', loc:'all', max:1400000, sort:'recent', onlyFav:false }),
      count: String(n), countLabel: n === 1 ? t.one : t.many,
      results: results, showGrid: n > 0 && s.view === 'grid', showList: n > 0 && s.view === 'list', showMap: n > 0 && s.view === 'map',
      isEmpty: n === 0, emptyP: (s.onlyFav && s.favs.length === 0) ? t.emptyFav : t.emptyP,
      selLabel: selP ? (t.see + ' · ' + selP.title) : t.see,
      empChips: empChips, emps: emps
    };
  }
}
